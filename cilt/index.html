<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Digital CILT</title>
<meta name="description" content="Digital Autonomous Maintenance – CILT for Körber BE4 and P4 packaging machines (TPM)">
<meta name="theme-color" content="#242269">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--navy:#242269;--coral:#F55B41;--blue:#323C8E;--tint:#D3DEF2;--bg:#F4F5FA;--card:#fff;--ink:#1d1d2b;--mut:#5b5f73;--line:#dfe3ee;
  --c:#1E6FD0;--i:#E07A00;--l:#2E9E44;--t:#8A4FBF;--ok:#2E9E44;--bad:#D9534F;--abn:#E07A00;--na:#7b8094;--r:12px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Century Gothic","Segoe UI",system-ui,-apple-system,sans-serif}
[dir=rtl] body{font-family:"Segoe UI","Noto Sans Arabic",Tahoma,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top))}
header.top::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--coral)}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand b{font-size:13px;letter-spacing:.12em}
.brand h1{font-size:16px;margin:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .tb{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:6px 10px;min-height:38px;cursor:pointer}
nav.bot{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.bot button{flex:1;border:0;background:none;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mut);font-size:12px;min-height:58px;cursor:pointer}
nav.bot button svg{width:24px;height:24px}
nav.bot button.on{color:var(--navy);font-weight:700;box-shadow:inset 0 3px 0 var(--coral)}
main{max-width:1180px;margin:0 auto;padding:14px 16px 96px}
.vt{color:var(--navy);margin:6px 0 12px}
.card,section.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:12px 0}
.card h3{margin:0 0 10px;color:var(--navy)}
.muted{color:var(--mut)} .sm{font-size:13px} small{font-size:12px}
.btn{border:1px solid var(--navy);background:#fff;color:var(--navy);border-radius:10px;padding:10px 16px;min-height:46px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.main{background:var(--navy);color:#fff}
.btn.big{min-height:56px;font-size:18px;padding:12px 22px}
.btn.ghost{background:#fff}
.btn.sm{min-height:36px;padding:6px 10px;font-size:13px}
.btn.block{width:100%;margin-top:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}
.row.end{justify-content:flex-end}.row.center{justify-content:center}
label{display:block;font-size:14px;color:var(--mut);margin:6px 0}
input,select,textarea{display:block;width:100%;margin-top:4px;border:1px solid #c9cfdf;border-radius:8px;padding:10px;background:#fff;min-height:44px}
textarea{min-height:44px;resize:vertical}
label.check{display:flex;gap:10px;align-items:center;color:var(--ink);font-size:15px}
label.check input{width:24px;height:24px;min-height:0;margin:0;flex:none}
label.need{color:var(--bad)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 12px;align-items:end}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
.warn{background:#FFF4E5;border:1px solid #F3C27A;color:#7a4500;border-radius:10px;padding:10px 12px;margin:10px 0}
.warn.bad,.bad{color:var(--bad)} .warn.bad{background:#fdecec;border-color:#f1b0ae}
.warn.sm{font-size:13px;padding:6px 10px}
.note{background:var(--tint);border-radius:10px;padding:10px;margin:10px 0;color:var(--navy);font-weight:600}
.empty{padding:30px;text-align:center;color:var(--mut)}
.hero{display:flex;gap:16px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;border-top:5px solid var(--coral)}
.hero-l{flex:1;min-width:0}.hero h2{margin:4px 0;color:var(--navy)}.hero h2 small{font-size:14px;color:var(--mut);font-weight:400}
.tag{font-size:12px;color:var(--coral);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px 12px;margin:10px 0}
.meta span{font-size:14px}.meta i{display:block;font-style:normal;font-size:11px;color:var(--mut);text-transform:uppercase}
@media (max-width:760px){.hero{flex-direction:column-reverse}.meta{grid-template-columns:1fr 1fr}}
.ring{--p:0;width:150px;height:150px;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--p)*1%),#e6e9f2 0);display:grid;place-items:center;flex:none}
.ring>div{width:118px;height:118px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring b{font-size:30px;color:var(--navy)}.ring span{font-size:11px;color:var(--mut);padding:0 10px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
.kpis.sm{grid-template-columns:repeat(4,1fr)}
@media (max-width:760px){.kpis,.kpis.sm{grid-template-columns:1fr 1fr}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px;border-inline-start:5px solid var(--blue)}
.kpi b{display:block;font-size:28px;color:var(--navy)}.kpi span{font-size:13px;color:var(--mut)}
.kpi.ok{border-inline-start-color:var(--ok)}.kpi.abn{border-inline-start-color:var(--abn)}.kpi.bad{border-inline-start-color:var(--bad)}
.zbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.zcell{min-width:96px;border:1px solid var(--line);border-radius:10px;padding:8px;background:#fafbff}
.zcell b{display:block;color:var(--navy)}.zcell span{font-size:12px;color:var(--mut)}
.zcell.done{background:#e8f6ec;border-color:var(--ok)}.zcell.cur{border:2px solid var(--coral)}
.catrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:560px){.catrow{grid-template-columns:repeat(2,minmax(0,1fr))}}
main{overflow-x:clip}.tw{overflow-x:auto;max-width:100%}
.catc{border-radius:10px;padding:12px;color:#fff;background:var(--cc);display:flex;flex-direction:column;align-items:flex-start}
.catc b{font-size:24px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.mcard{display:flex;flex-direction:column;text-align:start;background:#fff;border:2px solid var(--line);border-radius:var(--r);padding:0;overflow:hidden;cursor:pointer}
.mcard.on{border-color:var(--coral)}.mcard img{width:100%;height:170px;object-fit:contain;background:#fff;border-bottom:1px solid var(--line)}
.mcard>div{padding:12px}.mcard b{display:block;color:var(--navy);font-size:18px}.mcard small{display:block;color:var(--mut)}
.noimg{display:grid;place-items:center;min-height:140px;background:#eef1f8;color:var(--mut);padding:12px;text-align:center}
.steps{display:flex;gap:6px;margin:4px 0 6px;flex-wrap:wrap}.steps span{padding:6px 10px;border-radius:20px;background:#e6e9f2;font-size:13px}.steps span.on{background:var(--navy);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--navy);background:#fff;border-radius:22px;padding:8px 14px;min-height:42px;cursor:pointer}
.chip.on{background:var(--navy);color:#fff}.chip small{opacity:.75}
.safety{border-inline-start:5px solid var(--bad)}.safety ul{margin:6px 0;padding-inline-start:20px}
.safety.mini{border:0;background:#fdecec;border-radius:8px;padding:8px 10px;margin-bottom:8px}
.ref{display:block;color:var(--mut);font-size:12px;margin-top:4px}
.alt{font-size:13px;color:var(--mut)}
.runhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.runhead h2{margin:0;color:var(--navy)}
.pbar{position:relative;width:260px;max-width:100%;height:26px;background:#e6e9f2;border-radius:14px;overflow:hidden}
.pbar i{position:absolute;inset:0 auto 0 0;background:var(--ok)}[dir=rtl] .pbar i{inset:0 0 0 auto}
.pbar span{position:relative;display:block;text-align:center;font-size:13px;line-height:26px;font-weight:700}
.zsteps{display:flex;gap:4px;margin:10px 0;overflow-x:auto}.zsteps span{padding:4px 8px;border-radius:6px;background:#e6e9f2;font-size:12px;white-space:nowrap}
.zsteps span.done{background:var(--ok);color:#fff}.zsteps span.cur{background:var(--coral);color:#fff}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:10px 0;position:sticky;top:58px;z-index:10;background:var(--bg);padding:6px 0}
.tab{flex:1;min-width:110px;border:2px solid var(--cc,var(--navy));background:#fff;color:var(--cc,var(--navy));border-radius:10px;padding:8px;min-height:50px;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-weight:700}
.tab.on{background:var(--cc,var(--navy));color:#fff}.tab small{font-weight:400}.tab.full:not(.on)::after{content:"✓";margin-inline-start:4px}
.zone{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px}
@media (max-width:820px){.zone{grid-template-columns:1fr}}
.zimg{position:relative;width:fit-content;max-width:100%;margin:0 auto}.zimg img{max-width:100%;max-height:380px;width:auto;display:block;border-radius:8px;border:1px solid var(--line);background:#fff}
.zimg.edit{cursor:crosshair;max-width:760px}
.mk{position:absolute;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;background:var(--cc);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);text-decoration:none}
[dir=rtl] .mk{transform:translate(50%,-50%)}
.zinfo ul{margin:4px 0 8px;padding-inline-start:18px}
.cath{color:var(--cc);display:flex;align-items:center;gap:8px;border-bottom:3px solid var(--cc);padding-bottom:6px}
.pt{background:#fff;border:1px solid var(--line);border-inline-start:6px solid var(--cc);border-radius:var(--r);padding:12px;margin:12px 0;scroll-margin-top:130px}
.pt header{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.pt header b{color:var(--cc)}.pt h4{margin:0;flex:1;min-width:200px}
.pt.set{background:#fcfdff}.pt.flash{animation:fl 1.2s 2}@keyframes fl{50%{box-shadow:0 0 0 4px var(--coral)}}
.badge{font-size:11px;padding:3px 8px;border-radius:12px;background:#e6e9f2;color:var(--mut);white-space:nowrap}
.badge.warnb{background:#FFE7C2;color:#7a4500}.badge.demo{background:#ffd6d0;color:#a42b17}
.kv{display:grid;grid-template-columns:170px 1fr;gap:8px;padding:5px 0;border-bottom:1px dashed #edf0f6}
.kv i{font-style:normal;color:var(--mut);font-size:13px}
@media (max-width:560px){.kv{grid-template-columns:1fr;gap:0}}
.abl{margin:0;padding-inline-start:18px}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}
.act{min-height:54px;border-radius:10px;border:2px solid var(--line);background:#fff;font-weight:700;cursor:pointer;padding:6px}
.act.ok{border-color:var(--ok);color:var(--ok)}.act.bad{border-color:var(--bad);color:var(--bad)}.act.abn{border-color:var(--abn);color:var(--abn)}.act.na{border-color:var(--na);color:var(--na)}
.act.on.ok{background:var(--ok);color:#fff}.act.on.bad{background:var(--bad);color:#fff}.act.on.abn{background:var(--abn);color:#fff}.act.on.na{background:var(--na);color:#fff}
.photos{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.photos img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer}
.abnbox{background:#FFF4E5;border:1px solid #F3C27A;border-radius:10px;padding:10px;margin-top:10px}.abnbox h5{margin:0 0 4px;color:#7a4500}
.reading input{max-width:220px}.reading.out{color:var(--bad)}.reading.out input{border-color:var(--bad)}
.navbar{position:sticky;bottom:64px;display:flex;justify-content:space-between;gap:10px;background:rgba(244,245,250,.95);padding:10px 0;margin-top:10px}
.final{background:#fff;border-radius:var(--r);padding:24px;text-align:center;border:3px solid var(--abn);margin-top:20px}
.final.good{border-color:var(--ok)}.final.good h2{color:var(--ok)}.final h2{color:var(--abn)}
.tbl{width:100%;border-collapse:collapse;background:#fff;font-size:14px;margin:8px 0}
.tbl th{background:var(--navy);color:#fff;text-align:start;padding:8px}.tbl td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:nth-child(even) td{background:#f7f8fc}.tbl tr.pend td:nth-child(3){color:var(--bad);font-weight:700}
.tbl tr.abn td:nth-child(3){color:var(--abn);font-weight:700}.tbl tr.nc td:nth-child(3){color:var(--bad);font-weight:700}
.tbl tr.cat td{background:var(--cc)!important;color:#fff;font-weight:700}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--tint)}
.nowrap{white-space:nowrap}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.filters select{width:auto;min-width:160px}
.alist{display:grid;gap:8px}
.acard{text-align:start;background:#fff;border:1px solid var(--line);border-inline-start:6px solid var(--na);border-radius:10px;padding:10px 12px;cursor:pointer}
.acard .d{margin:4px 0}.acard .sev,.acard .st{font-size:12px;padding:2px 8px;border-radius:10px;background:#eef}
.sev-Low{border-inline-start-color:#7b8094}.sev-Medium{border-inline-start-color:var(--abn)}.sev-High{border-inline-start-color:var(--bad)}.sev-Critical{border-inline-start-color:#8b0000}
.sev-High .sev,.sev-Critical .sev{background:var(--bad);color:#fff}
.abnd .ro>div{padding:4px 0;border-bottom:1px dashed var(--line)}.abnd .ro i{display:block;font-style:normal;font-size:12px;color:var(--mut)}
.hist{padding-inline-start:20px}.hist li{margin:4px 0}
.zlist .zrow{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}.zrow span{flex:1}
#modal{position:fixed;inset:0;background:rgba(20,20,40,.5);z-index:50;display:none;align-items:flex-start;justify-content:center;padding:20px 10px;overflow:auto}
#modal.show{display:flex}
#modalBox{background:#fff;border-radius:14px;max-width:560px;width:100%;padding:16px;margin:auto 0}
#modalBox.wide{max-width:980px}
#modalHead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}#modalHead h3{margin:0;color:var(--navy)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:90vw;text-align:center}
#toast.show{opacity:1}#toast.bad{background:var(--bad)}#toast.ok{background:var(--ok)}
.report{background:#fff;padding:20px;border-radius:var(--r);border:1px solid var(--line)}
.rh{display:flex;align-items:center;gap:14px;border-bottom:4px solid var(--navy);padding-bottom:10px;margin-bottom:10px;flex-wrap:wrap}
.rh>div:first-child b{display:block;color:var(--navy);letter-spacing:.18em;font-size:20px}.rh>div:first-child span{font-size:11px;color:var(--coral)}
.rh h1{flex:1;font-size:20px;margin:0;color:var(--navy)}.rid{font-size:12px;color:var(--mut)}
.report h3{color:#fff;background:var(--navy);padding:6px 10px;border-radius:6px;font-size:15px;margin:18px 0 8px}
.kvt{width:100%;border-collapse:collapse;font-size:14px}.kvt th{text-align:start;background:var(--tint);color:var(--navy);padding:6px;width:18%}.kvt td{padding:6px;border-bottom:1px solid var(--line)}
.rz{break-inside:avoid-page}.rz h4{color:var(--navy);margin:14px 0 4px}.rzimg{max-width:min(380px,100%);max-height:220px;display:block;border:1px solid var(--line);border-radius:6px}
img.th{width:54px;height:54px;object-fit:cover;border-radius:4px;margin:1px}
.eng li{margin:4px 0;padding:4px 8px;border-inline-start:4px solid var(--na)}.eng .sev-High,.eng .sev-Critical{background:#fdecec}
.rf{margin-top:18px;font-size:11px;color:var(--mut);border-top:1px solid var(--line);padding-top:8px}
@media (max-width:560px){.kvt th,.kvt td{display:block;width:auto}.tbl{font-size:12px}.catc span{font-size:12px}}
@media print{
  header.top,nav.bot,.noprint,#toast,#modal{display:none!important}
  body{background:#fff}main{padding:0;max-width:none}.report{border:0;padding:0}
  .tbl th,.report h3,.tbl tr.cat td{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:A4;margin:12mm}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b>SERVIER</b><h1 id="appTitle">Digital Autonomous Maintenance – CILT</h1></div>
  <button class="tb" id="roleBtn">Operator</button>
  <button class="tb" id="langBtn">عربي</button>
</header>
<main id="view"><div class="empty">Loading…</div></main>
<nav class="bot">
  <button data-nav="dash" data-label="Dashboard"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg><span>Dashboard</span></button>
  <button data-nav="run" data-label="CILT"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg><span>CILT</span></button>
  <button data-nav="abn" data-label="Abnormalities"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg><span>Abnormalities</span></button>
  <button data-nav="rep" data-label="Reports"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg><span>Reports</span></button>
  <button data-nav="admin" data-label="Admin"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 000-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 00-1.7-1L15 3h-4l-.4 2.9a7.4 7.4 0 00-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 000 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 001.7 1L11 21h4l.4-2.9a7.4 7.4 0 001.7-1l2.5 1 2-3.5L19.4 13zM13 15.5A3.5 3.5 0 1116.5 12 3.5 3.5 0 0113 15.5z"/></svg><span>Admin</span></button>
</nav>
<div id="modal"><div id="modalBox"><div id="modalHead"><h3 id="modalTitle"></h3><button class="btn ghost sm" id="modalClose">✕</button></div><div id="modalBody"></div></div></div>
<div id="toast"></div>
<script src="data/machines.js"></script>
<script src="js/i18n_ar.js"></script>
<script src="js/lib.js"></script>
<script src="js/app.js"></script>
</body>
</html>
