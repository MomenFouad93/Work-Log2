ندہ ہوں، اور اپنی استطاعت کے مطابق تیرے عہد اور وعدے پر قائم ہوں۔ جو کچھ میں نے کیا اس کے شر سے تیری پناہ چاہتا ہوں۔ میں اپنے اوپر تیری نعمت کا اعتراف کرتا ہوں اور اپنے گناہ کا اعتراف کرتا ہوں، پس مجھے بخش دے، کیونکہ تیرے سوا کوئی گناہ نہیں بخشتا۔"}, "count": 1, "source": "البخاري 6306", "grade": "sahih", "tr_status": "needs-review", "tr_en_reviewed": true, "note": {"ar": "سيد الاستغفار.", "en": "Sayyid al-Istighfar, the master of seeking forgiveness."}}, {"id": "f02", "kind": "text", "ar": "رَبِّ اغْفِرْ لِي وَتُبْ عَلَيَّ إِنَّكَ أَنْتَ التَّوَّابُ الرَّحِيمُ", "tr": {"en": "My Lord, forgive me and accept my repentance; You are the Ever-Accepting of repentance, the Most Merciful.", "fr": "Seigneur, pardonne-moi et accepte mon repentir ; Tu es Celui qui accueille le repentir, le Miséricordieux.", "ur": "اے میرے رب! مجھے بخش دے اور میری توبہ قبول فرما، بے شک تو ہی بہت توبہ قبول کرنے والا، نہایت رحم کرنے والا ہے۔"}, "count": 100, "source": "أبو داود 1516؛ الترمذي 3434؛ ابن ماجه 3814", "grade": "sahih", "tr_status": "needs-review", "note": {"ar": "كان الصحابة يعدّون للنبي ﷺ في المجلس الواحد مائة مرة.", "en": "The Companions counted this from the Prophet a hundred times in a single sitting."}}, {"id": "f03", "kind": "text", "ar": "أَسْتَغْفِرُ اللَّهَ الْعَظِيمَ الَّذِي لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ وَأَتُوبُ إِلَيْهِ", "tr": {"en": "I seek forgiveness from Allah the Mighty, besides whom there is no god, the Ever-Living, the Self-Sustaining, and I repent to Him.", "fr": "Je demande pardon à Allah, le Magnifique, en dehors de Qui il n'y a de dieu, le Vivant, le Subsistant, et je me repens à Lui.", "ur": "میں عظمت والے اللہ سے مغفرت مانگتا ہوں جس کے سوا کوئی معبود نہیں، جو زندہ اور قائم رکھنے والا ہے، اور اسی کی طرف توبہ کرتا ہوں۔"}, "count": 1, "source": "أبو داود 1517؛ الترمذي 3577؛ الحاكم 1/511", "grade": "sahih", "tr_status": "needs-review", "note": {"ar": "من قالها غُفر له وإن كان فرّ من الزحف.", "en": "Whoever says it is forgiven, even if he fled from the battlefield (Abu Dawud, Tirmidhi)."}}, {"id": "f04", "kind": "text", "ar": "أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ", "tr": {"en": "I seek Allah's forgiveness and I repent to Him.", "fr": "Je demande pardon à Allah et je me repens à Lui.", "ur": "میں اللہ سے مغفرت مانگتا ہوں اور اسی کی طرف توبہ کرتا ہوں۔"}, "count": 100, "source": "البخاري 6307؛ مسلم 2702", "grade": "sahih", "tr_status": "needs-review", "note": {"ar": "كان النبي ﷺ يستغفر ويتوب في اليوم مائة مرة (وفي البخاري: أكثر من سبعين).", "en": "The Prophet sought forgiveness and repented a hundred times a day (Bukhari: more than seventy)."}}, {"id": "f05", "kind": "text", "ar": "اللَّهُمَّ إِنَّكَ عَفُوٌّ تُحِبُّ الْعَفْوَ فَاعْفُ عَنِّي", "tr": {"en": "O Allah, You are Pardoning and love to pardon, so pardon me.", "fr": "Ô Allah, Tu es Clément et Tu aimes pardonner ; pardonne-moi donc.", "ur": "اے اللہ! تو بہت معاف کرنے والا ہے اور معافی کو پسند کرتا ہے، پس مجھے معاف فرما دے۔"}, "count": 1, "source": "الترمذي 3513؛ ابن ماجه 3850؛ أحمد 25384", "grade": "sahih", "tr_status": "needs-review", "note": {"ar": "علّمها النبي ﷺ عائشة رضي الله عنها لتقولها في ليلة القدر.", "en": "Taught by the Prophet to Aisha for Laylat al-Qadr; it may be said at any time."}}]}, {"id": "quranic-duas", "names": {"ar": "أدعية من القرآن", "en": "Duas from the Quran", "fr": "Invocations coraniques", "ur": "قرآنی دعائیں"}, "window": "anytime", "items": [{"id": "q01", "kind": "quran", "ref": "2:127-128", "count": 1, "source": "القرآن الكريم 2:127-128", "grade": "quran", "note": {"ar": "إبراهيم وإسماعيل عند بناء الكعبة: تقبّل منا، واجعلنا مسلمين.", "en": "Ibrahim and Ismail building the Ka'ba: accept from us, make us submissive to You."}}, {"id": "q02", "kind": "quran", "ref": "2:201", "count": 1, "source": "القرآن الكريم 2:201", "grade": "quran", "note": {"ar": "«ربنا آتنا في الدنيا حسنة وفي الآخرة حسنة وقنا عذاب النار».", "en": "Good in this world and in the Hereafter."}}, {"id": "q03", "kind": "quran", "ref": "2:250", "count": 1, "source": "القرآن الكريم 2:250", "grade": "quran", "note": {"ar": "طلب الصبر والثبات والنصر على القوم الكافرين (جنود طالوت).", "en": "A plea for patience, firm footing and help (the soldiers of Talut)."}}, {"id": "q04", "kind": "quran", "ref": "2:286", "count": 1, "source": "القرآن الكريم 2:286", "grade": "quran", "note": {"ar": "«ربنا لا تؤاخذنا إن نسينا أو أخطأنا…»", "en": "Do not hold us accountable for forgetting or erring; do not burden us beyond our strength."}}, {"id": "q05", "kind": "quran", "ref": "3:8", "count": 1, "source": "القرآن الكريم 3:8", "grade": "quran", "note": {"ar": "«ربنا لا تُزغ قلوبنا بعد إذ هديتنا».", "en": "Do not let our hearts deviate after You have guided us."}}, {"id": "q06", "kind": "quran", "ref": "3:16", "count": 1, "source": "القرآن الكريم 3:16", "grade": "quran", "note": {"ar": "طلب المغفرة ووقاية عذاب النار.", "en": "Forgive our sins and protect us from the Fire."}}, {"id": "q07", "kind": "quran", "ref": "3:38", "count": 1, "source": "القرآن الكريم 3:38", "grade": "quran", "note": {"ar": "زكريا: طلب الذرية الطيبة.", "en": "Zakariya asks for righteous offspring."}}, {"id": "q08", "kind": "quran", "ref": "3:147", "count": 1, "source": "القرآن الكريم 3:147", "grade": "quran", "note": {"ar": "دعاء المؤمنين في القتال: اغفر لنا ذنوبنا وإسرافنا في أمرنا وثبّت أقدامنا.", "en": "Forgive our sins and excesses, make our feet firm."}}, {"id": "q09", "kind": "quran", "ref": "3:191-194", "count": 1, "source": "القرآن الكريم 3:191-194", "grade": "quran", "note": {"ar": "دعاء أولي الألباب عند التفكر في خلق السماوات والأرض.", "en": "The dua of people of understanding reflecting on creation."}}, {"id": "q10", "kind": "quran", "ref": "7:23", "count": 1, "source": "القرآن الكريم 7:23", "grade": "quran", "note": {"ar": "آدم وحواء: «ربنا ظلمنا أنفسنا وإن لم تغفر لنا وترحمنا لنكونن من الخاسرين».", "en": "Adam and Hawwa: forgive us and have mercy on us."}}, {"id": "q11", "kind": "quran", "ref": "7:126", "count": 1, "source": "القرآن الكريم 7:126", "grade": <script>/* engine.js - pure logic, no DOM. Works in browser (window.QE) and Node (module.exports). */
(function (root) {

  var E = {};

  /* ---------- small helpers ---------- */
  E.pad3 = function (n) { return String(n).padStart(3, '0'); };
  E.clamp = function (x, a, b) { return Math.max(a, Math.min(b, x)); };

  E.dayKey = function (d) {
    d = d || new Date();

  };

  // "03:30" -> minutes since midnight
  E.hm = function (s) {

  // window = {from:'03:30', to:'12:00'}; returns 'before' | 'in' | 'after'
  E.windowState = function (now, win) {

    var a = E.hm(win.from), b = E.hm(win.to);
    if (b === 0) b = 1440;

    if (t >= b) return 'after';
    return 'in';
  };

  /* ---------- Quran refs ---------- */
  // "2:255" -> {s:2,from:255,to:255};  "112:1-4" -> {s:112,from:1,to:4}
  E.parseRef = function (ref) {
    var m = /^(\d{1,3}):(\d{1,3})(?:-(\d{1,3}))?$/.exec(String(ref).trim());
    if (!m) return null;
    var s = +m[1], a = +m[2], b = m[3] ? +m[3] : a;
    if (b < a) return null;
    return { s: s, from: a, to: b };
  };

  /* ---------- WAV writing ---------- */
  function writeStr(v, o, s) { for (var i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); }

  function wavHeader(v, nSamples, sr) {
    writeStr(v, 0, 'RIFF'); v.setUint32(4, 36 + nSamples * 2, true);
    writeStr(v, 8, 'WAVE'); writeStr(v, 12, 'fmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true);
    v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    writeStr(v, 36, 'data'); v.setUint32(40, nSamples * 2, true);
  }

  // mono Float32 [-1,1] -> 16-bit PCM WAV ArrayBuffer
  E.floatToWav = function (f32, sr) {
    var n = f32.length, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
    wavHeader(v, n, sr);
    var o = 44;
    for (var i = 0; i < n; i++, o += 2) {

      v.setInt16(o, x < 0 ? x * 0x8000 : x * 0x7fff, true);
    }

  };

  E.silenceWav = function (seconds, sr) {

    var n = Math.max(1, Math.round(seconds * sr));
    var buf = new ArrayBuffer(44 + n * 2);
    wavHeader(new DataView(buf), n, sr);
    return buf;
  };

  // AudioBuffer-like {numberOfChannels, length, getChannelData(i)} -> mono Float32Array
  E.toMono = function (ab) {
    var ch = ab.numberOfChannels, n = ab.length, out = new Float32Array(n);
    if (ch === 1) { out.set(ab.getChannelData(0)); return out; }
    for (var c = 0; c < ch; c++) {

      for (var i = 0; i < n; i++) out[i] += d[i] / ch;
    }

  };

  /* ---------- gap logic ---------- */
  // gap = {mode:'fixed', seconds:3} | {mode:'auto', factor:1}
  // rate = playback speed: a fixed gap is kept in real seconds, so it is stretched in media time.
  E.gapSeconds = function (gap, ayahDuration, rate) {
    if (!gap) return 0;
    if (gap.mode === 'auto') {
      var d = (ayahDuration || 0) * (gap.factor || 1);
      return d > 0 ? Math.max(0.3, d) : 0;
    }

  // Split one recitation (mono PCM) into n pieces at the quietest point near each equal-time mark.

  E.splitPoints = function (pcm, sr, n) {
    var len = pcm.length;
    n = Math.max(1, Math.floor(n || 1));
    var equal = function () { var q = [0]; for (var z = 1; z < n; z++) q.push(Math.round(len * z / n)); q.push(len); return q; };
    if (n === 1) return [0, len];

    for (i = 0; i < nf; i++) { var sum = 0; for (j = i * fr; j < (i + 1) * fr; j++) sum += pcm[j] * pcm[j]; e[i] = Math.sqrt(sum / fr); }
    var sm = new Float32Array(nf);
    for (i = 0; i < nf; i++) { var a = 0, c = 0; for (j = Math.max(0, i - 3); j <= Math.min(nf - 1, i + 3); j++) { a += e[j]; c++; } sm[i] = a / c; }
    var b = [0], span = nf / n;
    for (var k = 1; k < n; k++) {
      var ideal = Math.round(span * k), w = Math.round(span * 0.25), best = ideal, bv = Infinity;
      for (i = Math.max(1, ideal - w); i <= Math.min(nf - 1, ideal + w); i++) {
        var v = sm[i] + Math.abs(i - ideal) * 1e-5; if (v < bv) { bv = v; best = i; }

      b.push(best * fr);
    }

    return b;
  };

  // unit = {id, repeat, parts:[{...audio ref...}]}

  // returns {steps:[{k:'play'|'gap', u, rep, p, round}], loop:bool}
  E.expandPlan = function (units, opts) {
    opts = opts || {};
    var pieces = Math.max(1, Math.floor(opts.pieces || 1));
    var rounds = opts.rounds === 0 ? 1 : Math.max(1, opts.rounds || 1);
    var loop = opts.rounds === 0;
    var gapOn = E.gapEnabled(opts.gap);
    var steps = [];
    for (var q = 0; q < rounds; q++) {
      for (var u = 0; u < units.length; u++) {
        var un = units[u], reps = Math.max(1, un.repeat || 1);
        for (var r = 0; r < reps; r++) {
          for (var p = 0; p < un.parts.length; p++) {
            for (var c = 0; c < pieces; c++) {
              steps.push({ k: 'play', u: u, rep: r, p: p, round: q, piece: c, pieces: pieces });
              var lastOfAll = !loop && q === rounds - 1 && u === units.length - 1 && r === reps - 1 && p === un.parts.length - 1 && c === pieces - 1;
              if (gapOn && !lastOfAll) steps.push({ k: 'gap', u: u, rep: r, p: p, round: q, piece: c, pieces: pieces });
            }
          }
        }
      }
    }
    return { steps: steps, loop: loop };
  };

  E.gapEnabled = function (gap) {
    if (!gap) return false;
    if (gap.mode === 'auto') return (gap.factor || 0) > 0;
    return (+gap.seconds || 0) > 0;
  };

  // is this step the last part of a repetition? (used for counting)
  E.isRepEnd = function (units, step) {
    return step.k === 'play' && step.p === units[step.u].parts.length - 1 && (step.piece || 0) === (step.pieces || 1) - 1;
  };

  /* ---------- chunk rendering (decode mode) ---------- */
  // getPCM(unit, part) -> Promise<Float32Array mono at sampleRate sr>
  // Renders steps[startIdx...] into one WAV until maxSec reached (always at least one play step).
  // returns {wav, segs:[{t0,t1,step,idx}], nextIdx, seconds}
  E.renderChunk = async function (units, steps, startIdx, getPCM, gap, sr, maxSec, rate) {
    var splitCache = new WeakMap();
    var parts = [], segs = [], t = 0, total = 0, idx = startIdx, lastDur = 0, playCount = 0;
    maxSec = maxSec || 150;
    while (idx < steps.length) {
      var st = steps[idx];
      if (st.k === 'play') {
        if (playCount > 0 && t >= maxSec) break;
        var pcm = await getPCM(units[st.u], units[st.u].parts[st.p]);
        var np = st.pieces || 1;
        if (np > 1) {
          var sc = splitCache.get(pcm); if (!sc) { sc = {}; splitCache.set(pcm, sc); }
          var bd = sc[np] || (sc[np] = E.splitPoints(pcm, sr, np));
          var pi = Math.min(st.piece || 0, bd.length - 2); pcm = pcm.subarray(bd[pi], bd[pi + 1]);
        }
        var dur = pcm.length / sr;
        parts.push(pcm); segs.push({ t0: t, t1: t + dur, step: st, idx: idx });
        t += dur; total += pcm.length; lastDur = dur; playCount++;
      } else {
        var g = E.gapSeconds(gap, lastDur, rate), n = Math.round(g * sr);
        if (n > 0) {
          parts.push(n); segs.push({ t0: t, t1: t + n / sr, step: st, idx: idx });
          t += n / sr; total += n;
        }
      }
      idx++;
    }

    for (var i = 0; i < parts.length; i++) {
      if (typeof parts[i] === 'number') off += parts[i];
      else { out.set(parts[i], off); off += parts[i].length; }
    }

    items.forEach(function (it) {
      if (onlyIid && it.id !== onlyIid) return;
      var target = it.count || 1, left = target - done(gid, it.id); if (left <= 0 && !onlyIid) return; if (left <= 0) left = target;
      var parts = itemParts(it); if (!parts.length) return;
      units.push({ id: it.id, label: it.title || (it.kind === 'quran' ? it.ref : ''), text: itemText(it), tr: itemTrans(it), repeat: left, parts: parts, it: it }); map.push(it);
    });
    if (!units.length) { toast(S.Q ? t('failed') : t('needQuran')); return; }
    Player.start({
      title: L(groupMeta(gid).names), units: units, rounds: 1, gap: S.settings.memo ? gapOpts() : { mode: 'fixed', seconds: 0 }, pieces: S.settings.memo ? +S.settings.pieces : 1, rate: +S.settings.speed || 1,
      onRep: function (ui_, rep) { var it = units[ui_].it; bump(gid, it.id, 1, it.count || 1); if (S.view.name === 'group') render(); }
    });
  }

  /* ================= diagnostics ================= */
  async function runDiag() {
    var out = $('#diag'); if (!out) return;
    var lines = [];
    function add(ok, msg) { lines.push((ok ? 'OK   ' : 'FAIL ') + msg); out.textContent = lines.join('\n'); }
    out.textContent = '...';
    add(true, 'page: ' + location.protocol + '//' + (location.host || '(file)') + ' | online=' + navigator.onLine);
    add(/^https?:$/.test(location.protocol), 'service worker/install needs https: ' + ('serviceWorker' in navigator));
    try { var k = 'diag' + Date.now(); await DB.put('kv', k, { a: 1 }); var v = await DB.get('kv', k); await DB.del('kv', k); add(!!v, 'IndexedDB storage'); } catch (e) { add(false, 'IndexedDB storage: ' + errMsg(e)); }
    try { localStorage.setItem('qc_diag', '1'); localStorage.removeItem('qc_diag'); add(true, 'localStorage'); } catch (e) { add(false, 'localStorage: ' + errMsg(e)); }
    var tests = [
      ['alquran.cloud text API', 'https://api.alquran.cloud/v1/ayah/1:1', 'json'],
      ['jsDelivr text', 'https://cdn.jsdelivr.net/gh/fawazahmed0/quran-api@1/editions/ara-quranuthmanihaf/1.json', 'json'],
      ['everyayah audio (needs CORS)', 'https://everyayah.com/data/Husary_Muallim_128kbps/001001.mp3', 'bytes']
    ];
    for (var i = 0; i < tests.length; i++) {
      try { var r = await fetchT(tests[i][1], 20000); if (!r.ok) throw new Error('HTTP ' + r.status); var n = tests[i][2] === 'json' ? JSON.stringify(await r.json()).length : (await r.arrayBuffer()).byteLength; add(true, tests[i][0] + ' (' + n + ' bytes)'); }
      catch (e) { add(false, tests[i][0] + ': ' + errMsg(e)); }
    }
    try { var AC = window.OfflineAudioContext || window.webkitOfflineAudioContext; add(!!AC, 'audio decoding (OfflineAudioContext)'); } catch (e) { add(false, 'audio decoding: ' + errMsg(e)); }
    add(true, 'ua: ' + navigator.userAgent.slice(0, 90));
  }

  /* ================= recording ================= */
  var Rec = {
    mr: null, chunks: [], rid: null,
    async toggle(rid) {
      if (this.mr && this.mr.state === 'recording') { this.mr.stop(); return; }
      try {
        var stream = await navigator.mediaDevices.getUserMedia({ audio: true }), self = this;
        var mime = window.MediaRecorder && MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : '';
        this.mr = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream); this.chunks = []; this.rid = rid;
        this.mr.ondataavailable = function (e) { if (e.data && e.data.size) self.chunks.push(e.data); };
        this.mr.onstop = async function () {
          stream.getTracks().forEach(function (tr) { tr.stop(); });
          var type = self.mr.mimeType || mime || 'audio/webm', blob = new Blob(self.chunks, { type: type });
          await DB.put('rec', self.rid, { buf: await blob.arrayBuffer(), mime: type }); S.recSet.add(self.rid); toast(t('saved')); render();
        };
        this.mr.start(); toast('● REC');
        document.querySelectorAll('[data-act=rec][data-rid="' + rid + '"]').forEach(function (b) { b.textContent = '⏹'; });
      } catch (e) { toast(t('failed')); }
    }
  };

  /* ================= share / import ================= */
  function shareLink() { return location.href.split('#')[0] + '#share=' + QE.b64urlEncode(QE.encodeShare(S.duas)); }
  function importText(txt) {
    var m = /#share=([A-Za-z0-9_-]+)/.exec(txt), j = txt;
    try { if (m) j = QE.b64urlDecode(m[1]); } catch (e) { }
    var list = QE.decodeShare(j); if (!list || !list.length) { toast(t('failed')); return 0; }
    list.forEach(function (d) { S.duas.push(Object.assign({ id: uid() }, d)); }); saveDuas(); return list.length;
  }

  /* ================= events ================= */
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]'); if (!el) return;
    var a = el.dataset.act, D = el.dataset;
    if (a === 'back') return back();
    if (a === 'tab') return tab(D.tab);
    if (a === 'openGroup') return go('group', { gid: D.gid });
    if (a === 'openSurah') { var sv = { s: +D.s, from: 1, to: S.Q.surahs[+D.s - 1].v.length }; return go('surah', sv); }
    if (a === 'inc') { var tg = +D.target, c = done(D.gid, D.iid); if (c < tg) bump(D.gid, D.iid, 1, tg); return render(); }
    if (a === 'dec') { bump(D.gid, D.iid, -1, +D.target); return render(); }
    if (a === 'resetGroup') { if (!confirm(t('confirmDel'))) return; var day = QE.dayKey(); if (S.progress[day]) delete S.progress[day][D.gid]; saveProgress(); return render(); }
    if (a === 'playGroup') return playGroup(D.gid);
    if (a === 'playItem') return playGroup(D.gid, D.iid);
    if (a === 'tts') { var it = groupItems(D.gid).filter(function (x) { return x.id === D.iid; })[0]; if (it) { var left = Math.max(1, (it.count || 1) - done(D.gid, it.id)); Player.stop(true); $('#mini').hidden = false; $('#mini-t').textContent = L(groupMeta(D.gid).names); TTS.run(itemText(it), left, function () { bump(D.gid, it.id, 1, it.count || 1); render(); }); } return; }
    if (a === 'rec') return Rec.toggle(D.rid);
    if (a === 'delrec') { if (confirm(t('confirmDel'))) DB.del('rec', D.rid).then(function () { S.recSet.delete(D.rid); render(); }); return; }
    if (a === 'editDua') return go('edit', { id: D.id });
    if (a === 'delDua') { if (confirm(t('confirmDel'))) { S.duas = S.duas.filter(function (x) { return x.id !== D.id; }); saveDuas(); DB.del('rec', 'i:u' + D.id).then(function () { S.recSet.delete('i:u' + D.id); }).catch(function () { }); render(); } return; }
    if (a === 'saveDua') {
      var text = $('#f-text').value.trim(); if (!text) return toast(t('failed'));
      var d = { id: D.id || uid(), title: $('#f-title').value.trim(), text: text, tr: $('#f-tr').value.trim(), count: QE.clamp(parseInt($('#f-count').value, 10) || 1, 1, 1000), when: $('#f-when').value };
      var i = S.duas.findIndex(function (x) { return x.id === d.id; }); if (i >= 0) S.duas[i] = d; else S.duas.push(d);
      saveDuas(); toast(t('saved')); return back();
    }
    if (a === 'shareDuas') {
      if (!S.duas.length) return toast(t('noDuas'));
      var link = shareLink();
      if (navigator.share) navigator.share({ title: 'Duas', text: link }).catch(function () { });
      else if (navigator.clipboard) navigator.clipboard.writeText(link).then(function () { toast(t('copied')); });
      return;
    }
    if (a === 'importDuas') { var tx = prompt(t('pasteHere')); if (tx) { var n = importText(tx); if (n) { toast(t('imported') + ' ' + n); render(); } } return; }
    if (a === 'gapMode') { S.settings.gapMode = D.m; saveSettings(); return render(); }
    if (a === 'gapSec') { S.settings.gapSeconds = +D.f; saveSettings(); return render(); }
    if (a === 'memo') { S.settings.memo = D.v === '1'; saveSettings(); return render(); }
    if (a === 'impAudio') {
      var fi = document.createElement('input'); fi.type = 'file'; fi.accept = 'audio/*';
      fi.onchange = function () { var f = fi.files[0]; if (!f) return; if (f.size > 8 * 1048576 || !(f.type.indexOf('audio') === 0 || /\.(m4a|mp3|wav|aac|ogg)$/i.test(f.name))) return toast(t('failed')); f.arrayBuffer().then(function (buf) { return DB.put('rec', D.rid, { buf: buf, mime: f.type || 'audio/mpeg' }); }).then(function () { S.recSet.add(D.rid); toast(t('saved')); render(); }).catch(function () { toast(t('failed')); }); };
      fi.click(); return;
    }
    if (a === 'gapFactor') { S.settings.gapFactor = +D.f; saveSettings(); return render(); }
    if (a === 'pickAyah') {
      var n2 = +D.a, v = S.view, r = selRange();
      if (v.anchor == null || n2 < r.from) { v.from = v.to = n2; v.anchor = n2; } else { v.to = n2; }
      return render();
    }
    if (a === 'playSurah') return playSurah();
    if (a === 'dlQuran') { var msg = $('#dlmsg'); downloadQuranText(function (m) { msg.textContent = m; }).then(function () { toast(t('ready')); render(); }).catch(function (e) { msg.textContent = t('failed') + ': ' + errMsg(e) + (navigator.onLine ? '' : ' (offline)'); }); return; }
    if (a === 'diag') { return runDiag(); }
    if (a === 'dlSurah') {
      var m2 = $('#dlmsg'), b = $('#dlbtn');
      downloadSurahAudio(S.view.s, function (k, n) { m2.textContent = t('downloading') + ' ' + k + '/' + n; }).then(function () { toast(t('downloaded')); render(); }).catch(function (e) { m2.textContent = t('failed') + ': ' + errMsg(e); });
      return;
    }
    if (a === 'dlTr') {
      var m3 = $('#dlmsg'), l = S.settings.tr; if (!l || l === 'none') return;
      m3.textContent = t('downloading'); downloadTranslation(l).then(function () { toast(t('ready')); render(); }).catch(function (e) { m3.textContent = t('failed') + ': ' + errMsg(e); }); return;
    }
    if (a === 'dlAll') {
      if (!S.Q) return toast(t('needQuran'));
      var m4 = $('#dlmsg'); (async function () { try { for (var s = 1; s <= 114; s++) { await downloadSurahAudio(s, function (k, n) { m4.textContent = t('downloading') + ' ' + s + '/114 · ' + k + '/' + n; }); } toast(t('downloaded')); render(); } catch (e) { m4.textContent = t('failed'); } })(); return;
    }
    if (a === 'clearAudio') { if (confirm(t('confirmDel'))) DB.clear('audio').then(function () { S.audioSet = new Set(); render(); }); return; }
    if (a === 'exportAll') {
      var data = JSON.stringify({ app: 'quran-car-backup', settings: S.settings, progress: S.progress, duas: S.duas });
      var file = new File([data], 'quran-car-backup.json', { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) navigator.share({ files: [file] }).catch(function () { });
      else { var u = URL.createObjectURL(file), aa = document.createElement('a'); aa.href = u; aa.download = file.name; aa.click(); setTimeout(function () { URL.revokeObjectURL(u); }, 1000); }
      return;
    }
    if (a === 'importAll') {
      var inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'application/json,.json';
      inp.onchange = function () { var f = inp.files[0]; if (!f) return; f.text().then(function (txt) { try { var o = JSON.parse(txt); if (o.app !== 'quran-car-backup') throw 0; if (Array.isArray(o.duas)) { S.duas = o.duas.map(function (d) { return { id: uid(), title: String(d.title || ''), text: String(d.text || ''), tr: String(d.tr || ''), count: QE.clamp(parseInt(d.count, 10) || 1, 1, 1000), when: ['morning', 'evening', 'anytime'].indexOf(d.when) >= 0 ? d.when : 'anytime' }; }); saveDuas(); } if (o.progress && typeof o.progress === 'object') { S.progress = cleanProgress(o.progress); saveProgress(); } toast(t('imported')); render(); } catch (e) { toast(t('failed')); } }); };
      inp.click(); return;
    }
    if (a === 'miniOpen') { $('#drive').hidden = false; var cs = Player.curStep(); if (cs) ui.playerStep(cs); return; }
    if (a === 'driveClose') { $('#drive').hidden = true; return; }
    if (a === 'pp') { if (TTS.on) { TTS.stop(); ui.playerHide(); return; } return Player.toggle(); }
    if (a === 'next') return Player.jump(1);
    if (a === 'prev') return Player.jump(-1);
    if (a === 'stop') { TTS.stop(); Player.stop(false); return; }
  });

  document.addEventListener('input', function (e) {
    var id = e.target.id;
    if (id === 'qsearch') { S.view.q = e.target.value; var pos = e.target.selectionStart; render(); var el = $('#qsearch'); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (x) { } } }
    if (id === 'o-gap') { S.settings.gapSeconds = Math.round(+e.target.value * 10) / 10; $('#o-gapv').textContent = S.settings.gapSeconds; saveSettings(); return; }
    if (false) {  /* legacy */ S.settings.gapSeconds = +e.target.value; $('#o-gapv').textContent = e.target.value; saveSettings(); }
    if (id === 's-font') { S.settings.fontScale = +e.target.value; saveSettings(); applyTheme(); }
  });
  document.addEventListener('change', function (e) {
    var id = e.target.id, v = e.target.value, st = S.settings;
    if (id === 'o-from' || id === 'o-to') { S.view.from = +$('#o-from').value; S.view.to = +$('#o-to').value; S.view.anchor = null; return render(); }
    if (id === 'o-rep') { st.repeatEach = +v; saveSettings(); }
    if (id === 'o-pieces') { st.pieces = +v; saveSettings(); }
    if (id === 'o-speed') { st.speed = +v; saveSettings(); }
    if (id === 'o-rounds') { st.rounds = +v; saveSettings(); }
    if (id === 'o-rec' || id === 's-rec') { st.reciter = v; if (reciter().kbps.indexOf(+st.kbps) < 0) st.kbps = reciter().kbps[0]; saveSettings(); render(); }
    if (id === 's-kbps') { st.kbps = +v; saveSettings(); }
    if (id === 's-lang') { st.lang = v; saveSettings(); render(); }
    if (id === 's-tr') { st.tr = v; saveSettings(); if (v !== 'none' && !S.TR[v]) { DB.get('kv', 'tr:' + v).then(function (d) { if (d) { S.TR[v] = d; render(); } else toast(t('download') + ' → ' + t('translation')); }); } render(); }
    if (id === 's-theme') { st.theme = v; saveSettings(); applyTheme(); }
    if (id === 's-m1' || id === 's-m2' || id === 's-e1' || id === 's-e2') { st.morning = { from: $('#s-m1').value, to: $('#s-m2').value }; st.evening = { from: $('#s-e1').value, to: $('#s-e2').value }; saveSettings(); }
  });
  document.querySelectorAll('#tabs button').forEach(function (b) { b.addEventListener('click', function () { tab(b.dataset.tab); }); });

  /* ================= boot ================= */
  async function boot() {
    root = $('#view'); Player.init();
    try { await loadQuranLocal(); } catch (e) { }
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () { });
    render();
    // incoming share link
    if (location.hash.indexOf('#share=') === 0) {
      var list = null; try { list = QE.decodeShare(QE.b64urlDecode(location.hash.slice(7))); } catch (e) { }
      history.replaceState(null, '', location.pathname + location.search);
      if (list && list.length && confirm((LANG === 'ar' ? 'استيراد ' : 'Import ') + list.length + (LANG === 'ar' ? ' دعاء؟' : ' duas?'))) {
        list.forEach(function (d) { S.duas.push(Object.assign({ id: uid() }, d)); }); saveDuas(); toast(t('imported')); render();
      }
    }
    setInterval(function () { if (S.view.name === 'today' && !document.hidden) render(); }, 60000);
    if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) navigator.serviceWorker.register('sw.js').catch(function () { });
  }
  window.__app = { S: S, Player: Player, render: render, go: go };
  boot();
})();
</script>
</body>
