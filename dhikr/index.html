َ الْهَمِّ وَالْحُزْنِ، وَالْعَجْزِ وَالْكَسَلِ، وَالْبُخْلِ وَالْجُبْنِ، وَضَلْعِ الدَّيْنِ وَغَلَبَةِ الرِّجَالِ", "tr": {"en": "O Allah, I seek refuge in You from worry and grief, from incapacity and laziness, from miserliness and cowardice, from the burden of debt and from being overpowered by men.", "fr": "Ô Allah, je me réfugie auprès de Toi contre le souci et la tristesse, l'incapacité et la paresse, l'avarice et la lâcheté, le poids de la dette et la domination des hommes.", "ur": "اے اللہ! میں فکر اور غم سے، بے بسی اور سستی سے، بخل اور بزدلی سے، قرض کے بوجھ سے اور لوگوں کے غلبے سے تیری پناہ چاہتا ہوں۔"}, "count": 1, "source": "البخاري 2893", "grade": "sahih", "tr_status": "needs-review", "audio": "a/h121.mp3"}, {"id": "d04", "kind": "text", "ar": "اللَّهُمَّ رَحْمَتَكَ أَرْجُو، فَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ، وَأَصْلِحْ لِي شَأْنِي كُلَّهُ، لَا إِلَهَ إِلَّا أَنْتَ", "tr": {"en": "O Allah, Your mercy is what I hope for, so do not leave me to myself even for the blink of an eye, and set right all my affairs. There is no god but You.", "fr": "Ô Allah, c'est Ta miséricorde que j'espère ; ne me laisse pas à moi-même, ne serait-ce que le temps d'un clin d'œil, et rends bon tout mon état. Il n'y a de dieu que Toi.", "ur": "اے اللہ! میں تیری رحمت کا امیدوار ہوں، پس پلک جھپکنے کی دیر کے لیے بھی مجھے میرے نفس کے حوالے نہ کر، اور میرے سارے کام سنوار دے۔ تیرے سوا کوئی معبود نہیں۔"}, "count": 1, "source": "أبو داود 5090؛ أحمد 20430", "grade": "hasan", "tr_status": "needs-review", "audio": "a/h123.mp3"}, {"id": "d05", "kind": "quran", "ref": "21:87", "count": 1, "source": "الترمذي 3505 (دعوة ذي النون)", "grade": "quran", "note": {"ar": "«لا إله إلا أنت سبحانك إني كنت من الظالمين» دعاء يونس عليه السلام؛ ما دعا بها مسلم في شيء إلا استجاب الله له.", "en": "The dua of Yunus: 'There is no god but You, glory be to You; I was among the wrongdoers.' No Muslim calls on Allah with it for anything but He answers (Tirmidhi)."}}, {"id": "d06", "kind": "text", "ar": "اللَّهُ اللَّهُ رَبِّي لَا أُشْرِكُ بِهِ شَيْئًا", "tr": {"en": "Allah, Allah is my Lord; I associate nothing with Him.", "fr": "Allah, Allah est mon Seigneur ; je ne Lui associe rien.", "ur": "اللہ، اللہ ہی میرا رب ہے؛ میں اس کے ساتھ کسی کو شریک نہیں کرتا۔"}, "count": 1, "source": "أبو داود 1525؛ ابن ماجه 3882", "grade": "sahih", "tr_status": "needs-review", "audio": "a/h125.mp3"}, {"id": "d07", "kind": "text", "ar": "اللَّهُمَّ لَا سَهْلَ إِلَّا مَا جَعَلْتَهُ سَهْلًا، وَأَنْتَ تَجْعَلُ الْحَزْنَ إِذَا شِئْتَ سَهْلًا", "tr": {"en": "O Allah, there is no ease except what You make easy, and You make the difficult easy if You wish.", "fr": "Ô Allah, il n'est de facilité que ce que Tu rends facile, et Tu rends aisé le difficile si Tu le veux.", "ur": "اے اللہ! کوئی چیز آسان نہیں مگر وہی جسے تو آسان کر دے، اور تو چاہے تو مشکل کو آسان کر دیتا ہے۔"}, "count": 1, "source": "ابن حبان 2427؛ ابن السني 351", "grade": "sahih", "tr_status": "needs-review", "note": {"ar": "لمن اشتد عليه أمر.", "en": "For one whose affair has become difficult."}}, {"id": "d08", "kind": "quran", "ref": "3:173", "count": 1, "source": "البخاري 4563", "grade": "quran", "note": {"ar": "«حسبنا الله ونعم الوكيل»: قالها إبراهيم حين أُلقي في النار وقالها محمد ﷺ حين قيل له إن الناس قد جمعوا لكم.", "en": "'Allah is sufficient for us and the best Disposer of affairs': said by Ibrahim when thrown into the fire and by Muhammad when told the people had gathered against them (Bukhari)."}}]}, {"id": "forgiveness", "names": {"ar": "الاستغفار", "en": "Seeking Forgiveness", "fr": "Demander pardon", "ur": "استغفار"}, "window": "anytime", "items": [{"id": "f01", "kind": "text", "ar": "اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ", "tr": {"en": "O Allah, You are my Lord; there is no god but You. You created me and I am Your servant, and I keep Your covenant and promise as best I can. I seek refuge in You from the evil of what I have done. I acknowledge Your favour upon me and I acknowledge my sin, so forgive me, for none forgives sins except You.", "fr": "Ô Allah, Tu es mon Seigneur ; il n'y a de dieu que Toi. Tu m'as créé et je suis Ton serviteur, et je me tiens à Ton engagement et à Ta promesse autant que je le peux. Je me réfugie auprès de Toi contre le mal de ce que j'ai commis. Je reconnais Ton bienfait envers moi et je reconnais mon péché ; pardonne-moi, car nul ne pardonne les péchés en dehors de Toi.", "ur": "اے اللہ! تو میرا رب ہے، تیرے سوا کوئی معبود نہیں۔ تو نے مجھے پیدا کیا اور میں تیرا بندہ ہوں، اور اپنی استطاعت کے مطابق تیرے عہد اور وعدے پر قائم ہوں۔ جو کچھ میں نے کیا اس کے شر سے تیری پناہ چاہتا ہوں۔ میں اپنے اوپر تیری نعمت کا اعتراف کرتا ہوں اور اپنے گناہ کا اعتراف کرتا ہوں، پس مجھے بخش دے، کیونکہ تیرے سوا کوئی گناہ نہیں بخشتا۔"}, "count": 1, "source": "البخاري 6306", "grade": "sahih", "tr_status": "needs-review", "tr_en_reviewed": true, "note": {"ar": "سيد الاستغفار.", "en": "Sayyid al-Istighfar, the master of seeking forgiveness."}, "audio": "a/h79.mp3"}, {"id": "f02", "kind": "text", "ar": "رَبِّ اغْفِرْ لِي وَتُبْ عَلَيَّ إِنَّكَ أَنْتَ التَّوَّابُ الرَّحِيمُ", "tr": {"en": "My Lord, forgive me and accept my repentance; You are the Ever-Accepting of repentance, the Most Merciful.", "fr": "Seigneur, pardonne-moi et accepte mon repentir ; Tu es Celui qui accueille le repentir, le Miséricordieux.", "ur": "اے میرے رب! مجھے بخش دے اور میری توبہ قبول فرما، بے شک تو ہی بہت توبہ قبول کرنے والا، نہایت رحم کرنے والا ہے۔"}, "count": 100, "source": "أبو داود 1516؛ الترمذي 3434؛ ابن ماجه 3814", "grade": "sahih", "tr_status": "needs-review", "note": {"ar": "كان الصحابة يعدّون للنبي ﷺ في المجلس الواحد مائة مرة.", "en": "The Companions counted this from the Prophet a hundred times in a single sitting."}}, {"id": "f03", "kind": "text", "ar": "أَسْتَغْفِرُ اللَّهَ الْعَظِيمَ الَّذِي لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ وَأَتُوبُ إِلَيْهِ", "tr": {"en": "I seek forgiveness from Allah the Mighty, besides whom there is no god, the Ever-Living, the Self-Sustaining, and I repent to Him.", "fr": "Je demande pardon à Allah, le Magnifique, en dehors de Qui il n'y a de dieu, le Vivant, le Subsistant, et je me repens à Lui.", "ur": "میں عظمت والے اللہ سے مغفرت مانگتا ہوں جس کے سوا کوئی معبود نہیں، جو زندہ اور قائم رکھنے والا ہے، اور اسی کی طرف توبہ کرتا ہوں۔"}, "count": 1, "source": "أبو داود 1517؛ الترمذي 3577؛ الحاكم 1/511", "grade": "sahih", "tr_status": "needs-review", "note": {"ar": "من قالها غُفر له وإن كان فرّ من الزحف.", "en": "Whoever says it is forgiven, even if he fled from the battlefield (Abu Dawud, Tirmidhi)."}}, {"id": "f04", "kind": "text", "ar": "أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ", "tr": {"en": "I seek Allah's forgiveness and I repent to Him.", "fr": "Je demande pardon à Allah et je me repens à Lui.", "ur": "میں اللہ سے مغفرت مانگتا ہوں اور اسی کی طرف توبہ کرتا ہوں۔"}, "count": 100, "source": "البخاري 6307؛ مسلم 2702", "grade": "sahih", "tr_status": "needs-review", "note": {"ar": "كان النبي ﷺ يستغفر ويتوب في اليوم مائة مرة (وفي البخاري: أكثر من سبعين).", "en": "The Prophet sought forgiveness and repented a hundred times a day (Bukhari: more than seventy)."}, "audio": "a/h96.mp3"}, {"id": "f05", "kind": "text", "ar": "اللَّهُمَّ إِنَّكَ عَفُوٌّ تُحِبُّ الْعَفْوَ فَاعْفُ عَنِّي", "tr": {"en": "O Allah, You are Pardoning and love to pardon, so pardon me.", "fr": "Ô Allah, Tu es Clément et Tu aimes pardonner ; pardonne-moi donc.", "ur": "اے اللہ! تو بہت معاف کرنے والا ہے اور معافی کو پسند کرتا ہے، پس مجھے معاف فرما دے۔"}, "count": 1, "source": "الترمذي 3513؛ ابن ماجه 3850؛ أحمد 25384", "grade": "sahih", "tr_status": "needs-review", "note": {"ar": "علّمها النبي ﷺ عائشة رضي الله عنها لتقولها في ليلة القدر.", "en": "Taught by the Prophet to Aisha for Laylat al-Qadr; it may be said at any time."}}]}, {"id": "quranic-duas", "names": {"ar": "أدعية من القرآن", "en": "Duas from the Quran", "fr": "Invocations coraniques", "ur": "قرآنی دعائیں"}, "window": "anytime", "items": [{"id": "q01", "kind": "quran", "ref": "2:127-128", "count": 1, "source": "القرآن الكريم 2:127-128", "grade": "quran", "note": {"ar": "إبراهيم وإسماعيل عند بناء الكعبة: تقبّل منا، واجعلنا مسلمين.", "en": "Ibrahim and Ismail building the Ka'ba: accept from us, make us submissive to You."}}, {"id": "q02", "kind": "quran", "ref": "2:201", "count": 1, "source": "القرآن الكريم 2:201", "grade": "quran", "note": {"ar": "«ربنا آتنا في الدنيا حسنة وفي الآخرة حسنة وقنا عذاب النار».", "en": "Good in this world and in the Hereafter."}}, {"id": "q03", "kind": "quran", "ref": "2:250", "count": 1, "source": "القرآن الكريم 2:250", "grade": "quran", "note": {"ar": "طلب الصبر والثبات والنصر على القوم الكافرين (جنود طالوت).", "en": "A plea for patience, firm footing and help (the soldiers of Talut)."}}, {"id": "q04", "kind": "quran", "ref": "2:286", "count": 1, "source": "القرآن الكريم 2:286", "grade": "quran", "note": {"ar": "«ربنا لا تؤاخذنا إن نسينا أو أخطأنا…»", "en": "Do not hold us accountable for forgetting or erring; do not burden us beyond our strength."}}, {"id": "q05", "kind": "quran", "ref": "3:8", "count": 1, "source": "القرآن الكريم 3:8", "grade": "quran", "note": {"ar": "«ربنا لا تُزغ قلوبنا بعد إذ هديتنا».", "en": "Do not let our hearts deviate after You have guided us."}}, {"id": "q06", "kind": "quran", "ref": "3:16", "count": 1, "source": "القرآن الكريم 3:16", "grade": "quran", "note": {"ar": "طلب المغفرة ووقاية عذاب النار.", "en": "Forgive our sins and protect us from the Fire."}}, {"id": "q07", "kind": "quran", "ref": "3:38", "count": 1, "source": "القرآن الكريم 3:38", "grade": "quran", "note": {"ar": "زكريا: طلب الذرية الطيبة.", "en": "Zakariya asks for righteous offspring."}}, {"id": "q08", "kind": "quran", "ref": "3:147", "count": 1, "source": "القرآن الكريم 3:147", "grade": "quran", "note": {"ar": "دعاء المؤمنين في القتال: اغفر لنا ذنوبنا وإسرافنا في أمرنا وثبّت أقدامنا.", "en": "Forgive our sins and excesses, make our feet firm."}}, {"id": "q09", "kind": "quran", "ref": "3:191-194", "count": 1, "source": "القرآن الكريم 3:191-194", "grade": "quran", "note": {"ar": "دعاء أولي الألباب عند التفكر في خلق السماوات والأرض.", "en": "The dua of people of understanding reflecting on creation."}}, {"id": "q10", "kind": "quran", "ref": "7:23", "count": 1, "source": "القرآن الكريم 7:23", "grade": "quran", "note": {"ar": "آدم وحواء: «ربنا ظلمنا أنفسنا وإن لم تغفر لنا وترحمنا لنكونن من الخاسرين».", "en": "Adam and Hawwa: forgive us and have mercy on us."}}, {"id": "q11", "kind": "quran", "ref": "7:126", "count": 1, "source": "القرآن الكريم 7:126", "grade": "quran", "note": {"ar": "السحرة: «ربنا أفرغ علينا صبرًا وتوفنا مسلمين».", "en": "Pour patience upon us and let us die as Muslims."}}, {"id": "q12", "kind": "quran", "ref": "10:85-86", "count": 1, "source": "القرآن الكريم 10:85-86", "grade": "quran", "note": {"ar": "دعاء المؤمنين من قوم موسى: التوكل ونجّنا برحمتك.", "en": "Reliance on Allah and rescue by His mercy."}}, {"id": "q13", "kind": "quran", "ref": "11:47", "count": 1, "source": "القرآن الكريم 11:47", "grade": "quran", "note": {"ar": "نوح: الاستعاذة من سؤال ما ليس له به علم.", "en": "Nuh seeks refuge from asking what he has no knowledge of."}}, {"id": "q14", "kind": "quran", "ref": "12:101", "count": 1, "source": "القرآن الكريم 12:101", "grade": "quran", "note": {"ar": "يوسف: «توفني مسلمًا وألحقني بالصالحين».", "en": "Yusuf: let me die as a Muslim and join the righteous."}}, {"id": "q15", "kind": "quran", "ref": "14:40-41", "count": 1, "source": "القرآن الكريم 14:40-41", "grade": "quran", "note": {"ar": "إبراهيم: «رب اجعلني مقيم الصلاة ومن ذريتي… ربنا اغفر لي ولوالدي وللمؤمنين».", "en": "Ibrahim: keep me and my offspring steadfast in prayer; forgive me, my parents and the believers."}}, {"id": "q16", "kind": "quran", "ref": "17:24", "count": 1, "source": "القرآن الكريم 17:24", "grade": "quran", "note": {"ar": "«رب ارحمهما كما ربياني صغيرًا» دعاء للوالدين.", "en": "Dua for parents."}}, {"id": "q17", "kind": "quran", "ref": "17:80", "count": 1, "source": "القرآن الكريم 17:80", "grade": "quran", "note": {"ar": "«رب أدخلني مدخل صدق وأخرجني مخرج صدق».", "en": "Make my entering and my leaving by truth."}}, {"id": "q18", "kind": "quran", "ref": "18:10", "count": 1, "source": "القرآن الكريم 18:10", "grade": "quran", "note": {"ar": "دعاء الفتية في الكهف: رحمة من لدنك وتهيئة رشد.", "en": "The dua of the youths of the cave: mercy and right guidance."}}, {"id": "q19", "kind": "quran", "ref": "20:25-28", "count": 1, "source": "القرآن الكريم 20:25-28", "grade": "quran", "note": {"ar": "موسى: «رب اشرح لي صدري…» لتيسير الأمر وفصاحة اللسان.", "en": "Musa: expand my chest, ease my task, loosen my tongue."}}, {"id": "q20", "kind": "quran", "ref": "20:114", "count": 1, "source": "القرآن الكريم 20:114", "grade": "quran", "note": {"ar": "«رب زدني علمًا».", "en": "My Lord, increase me in knowledge."}}, {"id": "q21", "kind": "quran", "ref": "21:83", "count": 1, "source": "القرآن الكريم 21:83", "grade": "quran", "note": {"ar": "أيوب: «أني مسني الضر وأنت أرحم الراحمين».", "en": "Ayyub in his affliction."}}, {"id": "q22", "kind": "quran", "ref": "21:87", "count": 1, "source": "القرآن الكريم 21:87", "grade": "quran", "note": {"ar": "يونس: «لا إله إلا أنت سبحانك إني كنت من الظالمين».", "en": "Yunus: there is no god but You, glory be to You; I was among the wrongdoers."}}, {"id": "q23", "kind": "quran", "ref": "21:89", "count": 1, "source": "القرآن الكريم 21:89", "grade": "quran", "note": {"ar": "زكريا: «رب لا تذرني فردًا وأنت خير الوارثين».", "en": "Zakariya: do not leave me alone."}}, {"id": "q24", "kind": "quran", "ref": "23:97-98", "count": 1, "source": "القرآن الكريم 23:97-98", "grade": "quran", "note": {"ar": "الاستعاذة من همزات الشياطين وأن يحضرون.", "en": "Refuge from the whisperings of the devils."}}, {"id": "q25", "kind": "quran", "ref": "23:118", "count": 1, "source": "القرآن الكريم 23:118", "grade": "quran", "note": {"ar": "«رب اغفر وارحم وأنت خير الراحمين».", "en": "My Lord, forgive and have mercy; You are the best of the merciful."}}, {"id": "q26", "kind": "quran", "ref": "25:74", "count": 1, "source": "القرآن الكريم 25:74", "grade": "quran", "note": {"ar": "«ربنا هب لنا من أزواجنا وذرياتنا قرة أعين».", "en": "Righteous spouses and offspring, a comfort to our eyes."}}, {"id": "q27", "kind": "quran", "ref": "26:83-85", "count": 1, "source": "القرآن الكريم 26:83-85", "grade": "quran", "note": {"ar": "إبراهيم: «رب هب لي حكمًا وألحقني بالصالحين».", "en": "Ibrahim: grant me wisdom and join me with the righteous."}}, {"id": "q28", "kind": "quran", "ref": "27:19", "count": 1, "source": "القرآن الكريم 27:19", "grade": "quran", "note": {"ar": "سليمان: شكر النعمة والعمل الصالح.", "en": "Sulayman: thankfulness and righteous deeds."}}, {"id": "q29", "kind": "quran", "ref": "28:16", "count": 1, "source": "القرآن الكريم 28:16", "grade": "quran", "note": {"ar": "موسى: «رب إني ظلمت نفسي فاغفر لي».", "en": "Musa: I have wronged myself, so forgive me."}}, {"id": "q30", "kind": "quran", "ref": "28:24", "count": 1, "source": "القرآن الكريم 28:24", "grade": "quran", "note": {"ar": "موسى: «رب إني لما أنزلت إليّ من خير فقير».", "en": "Musa: I am in need of whatever good You send down to me."}}, {"id": "q31", "kind": "quran", "ref": "37:100", "count": 1, "source": "القرآن الكريم 37:100", "grade": "quran", "note": {"ar": "إبراهيم: «رب هب لي من الصالحين».", "en": "Ibrahim: grant me a righteous child."}}, {"id": "q32", "kind": "quran", "ref": "43:13-14", "count": 1, "source": "القرآن الكريم 43:13-14", "grade": "quran", "note": {"ar": "دعاء ركوب الدابة أو السيارة.", "en": "The dua for riding an animal or a vehicle."}}, {"id": "q33", "kind": "quran", "ref": "46:15", "count": 1, "source": "القرآن الكريم 46:15", "grade": "quran", "note": {"ar": "شكر النعمة وصلاح الذرية.", "en": "Gratitude and the righteousness of one's offspring."}}, {"id": "q34", "kind": "quran", "ref": "59:10", "count": 1, "source": "القرآن الكريم 59:10", "grade": "quran", "note": {"ar": "«ربنا اغفر لنا ولإخواننا الذين سبقونا بالإيمان».", "en": "Forgive us and our brothers who preceded us in faith."}}, {"id": "q35", "kind": "quran", "ref": "66:8", "count": 1, "source": "القرآن الكريم 66:8", "grade": "quran", "note": {"ar": "«ربنا أتمم لنا نورنا واغفر لنا».", "en": "Perfect our light for us and forgive us."}}, {"id": "q36", "kind": "quran", "ref": "71:28", "count": 1, "source": "القرآن الكريم 71:28", "grade": "quran", "note": {"ar": "نوح: المغفرة له ولوالديه وللمؤمنين.", "en": "Nuh: forgive me, my parents and the believers."}}]}], "audio_credit": {"ar": "أصوات الأذكار: حمد الدريهم (تسجيلات حصن المسلم، hisnmuslim.com) عبر مستودع Adhkar-json المفتوح", "en": "Adhkar voice: Hamad Al-Duraihim (Hisn al-Muslim recordings, hisnmuslim.com) via the open Adhkar-json repository"}};</script>
<script>/* engine.js - pure logic, no DOM. Works in browser (window.QE) and Node (module.exports). */
(function (root) {
  'use strict';
  var E = {};

  /* ---------- small helpers ---------- */
  E.pad3 = function (n) { return String(n).padStart(3, '0'); };
  E.clamp = function (x, a, b) { return Math.max(a, Math.min(b, x)); };

  E.dayKey = function (d) {
    d = d || new Date();
    var m = d.getMonth() + 1, dd = d.getDate();
    return d.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (dd < 10 ? '0' : '') + dd;
  };

  // "03:30" -> minutes since midnight
  E.hm = function (s) {
    var p = String(s || '0:0').split(':');
    return (parseInt(p[0], 10) || 0) * 60 + (parseInt(p[1], 10) || 0);
  };

  // window = {from:'03:30', to:'12:00'}; returns 'before' | 'in' | 'after'
  E.windowState = function (now, win) {
    var t = now.getHours() * 60 + now.getMinutes();
    var a = E.hm(win.from), b = E.hm(win.to);
    if (b === 0) b = 1440;
    if (t < a) return 'before';
    if (t >= b) return 'after';
    return 'in';
  };

  /* ---------- Quran refs ---------- */
  // "2:255" -> {s:2,from:255,to:255};  "112:1-4" -> {s:112,from:1,to:4}
  E.parseRef = function (ref) {
    var m = /^(\d{1,3}):(\d{1,3})(?:-(\d{1,3}))?$/.exec(String(ref).trim());
    if (!m) return null;
    var s = +m[1], a = +m[2], b = m[3] ? +m[3] : a;
    if (b < a) return null;
    return { s: s, from: a, to: b };
  };

  /* ---------- WAV writing ---------- */
  function writeStr(v, o, s) { for (var i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); }

  function wavHeader(v, nSamples, sr) {
    writeStr(v, 0, 'RIFF'); v.setUint32(4, 36 + nSamples * 2, true);
    writeStr(v, 8, 'WAVE'); writeStr(v, 12, 'fmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true);
    v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    writeStr(v, 36, 'data'); v.setUint32(40, nSamples * 2, true);
  }

  // mono Float32 [-1,1] -> 16-bit PCM WAV ArrayBuffer
  E.floatToWav = function (f32, sr) {
    var n = f32.length, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
    wavHeader(v, n, sr);
    var o = 44;
    for (var i = 0; i < n; i++, o += 2) {
      var x = f32[i]; x = x < -1 ? -1 : (x > 1 ? 1 : x);
      v.setInt16(o, x < 0 ? x * 0x8000 : x * 0x7fff, true);
    }
    return buf;
  };

  // silent WAV (zero-filled), no decoding needed
  E.silenceWav = function (seconds, sr) {
    sr = sr || 8000;
    var n = Math.max(1, Math.round(seconds * sr));
    var buf = new ArrayBuffer(44 + n * 2);
    wavHeader(new DataView(buf), n, sr);
    return buf;
  };

  // AudioBuffer-like {numberOfChannels, length, getChannelData(i)} -> mono Float32Array
  E.toMono = function (ab) {
    var ch = ab.numberOfChannels, n = ab.length, out = new Float32Array(n);
    if (ch === 1) { out.set(ab.getChannelData(0)); return out; }
    for (var c = 0; c < ch; c++) {
      var d = ab.getChannelData(c);
      for (var i = 0; i < n; i++) out[i] += d[i] / ch;
    }
    return out;
  };

  /* ---------- gap logic ---------- */
  // gap = {mode:'fixed', seconds:3} | {mode:'auto', factor:1}
  // rate = playback speed: a fixed gap is kept in real seconds, so it is stretched in media time.
  E.gapSeconds = function (gap, ayahDuration, rate) {
    if (!gap) return 0;
    if (gap.mode === 'auto') {
      var d = (ayahDuration || 0) * (gap.factor || 1);
      return d > 0 ? Math.max(0.3, d) : 0;
    }
    return Math.max(0, +gap.seconds || 0) * (rate || 1);
  };

  // Split one recitation (mono PCM) into n pieces at the quietest point near each equal-time mark.
  // returns n+1 sample boundaries.
  E.splitPoints = function (pcm, sr, n) {
    var len = pcm.length;
    n = Math.max(1, Math.floor(n || 1));
    var equal = function () { var q = [0]; for (var z = 1; z < n; z++) q.push(Math.round(len * z / n)); q.push(len); return q; };
    if (n === 1) return [0, len];
    if (len < sr * 0.6 * n) return equal();
    var fr = Math.max(1, Math.round(sr * 0.01)), nf = Math.floor(len / fr), e = new Float32Array(nf), i, j;

      var d = { id: D.id || uid(), title: $('#f-title').value.trim(), text: text, tr: $('#f-tr').value.trim(), count: QE.clamp(parseInt($('#f-count').value, 10) || 1, 1, 1000), when: $('#f-when').value };
      var i = S.duas.findIndex(function (x) { return x.id === d.id; }); if (i >= 0) S.duas[i] = d; else S.duas.push(d);
      saveDuas(); toast(t('saved')); return back();
    }
    if (a === 'shareDuas') {
      if (!S.duas.length) return toast(t('noDuas'));
      var link = shareLink();
      if (navigator.share) navigator.share({ title: 'Duas', text: link }).catch(function () { });
      else if (navigator.clipboard) navigator.clipboard.writeText(link).then(function () { toast(t('copied')); });
      return;
    }
    if (a === 'importDuas') { var tx = prompt(t('pasteHere')); if (tx) { var n = importText(tx); if (n) { toast(t('imported') + ' ' + n); render(); } } return; }
    if (a === 'gapMode') { S.settings.gapMode = D.m; saveSettings(); return render(); }
    if (a === 'gapSec') { S.settings.gapSeconds = +D.f; saveSettings(); return render(); }
    if (a === 'memo') { S.settings.memo = D.v === '1'; saveSettings(); return render(); }
    if (a === 'impAudio') {
      var fi = document.createElement('input'); fi.type = 'file'; fi.accept = 'audio/*';
      fi.onchange = function () { var f = fi.files[0]; if (!f) return; if (f.size > 8 * 1048576 || !(f.type.indexOf('audio') === 0 || /\.(m4a|mp3|wav|aac|ogg)$/i.test(f.name))) return toast(t('failed')); f.arrayBuffer().then(function (buf) { return DB.put('rec', D.rid, { buf: buf, mime: f.type || 'audio/mpeg' }); }).then(function () { S.recSet.add(D.rid); toast(t('saved')); render(); }).catch(function () { toast(t('failed')); }); };
      fi.click(); return;
    }
    if (a === 'gapFactor') { S.settings.gapFactor = +D.f; saveSettings(); return render(); }
    if (a === 'pickAyah') {
      var n2 = +D.a, v = S.view, r = selRange();
      if (v.anchor == null || n2 < r.from) { v.from = v.to = n2; v.anchor = n2; } else { v.to = n2; }
      return render();
    }
    if (a === 'playSurah') return playSurah();
    if (a === 'dlQuran') { var msg = $('#dlmsg'); downloadQuranText(function (m) { msg.textContent = m; }).then(function () { toast(t('ready')); render(); }).catch(function (e) { msg.textContent = t('failed') + ': ' + errMsg(e) + (navigator.onLine ? '' : ' (offline)'); }); return; }
    if (a === 'diag') { return runDiag(); }
    if (a === 'dlSurah') {
      var m2 = $('#dlmsg'), b = $('#dlbtn');
      downloadSurahAudio(S.view.s, function (k, n) { m2.textContent = t('downloading') + ' ' + k + '/' + n; }).then(function () { toast(t('downloaded')); render(); }).catch(function (e) { m2.textContent = t('failed') + ': ' + errMsg(e); });
      return;
    }
    if (a === 'dlTr') {
      var m3 = $('#dlmsg'), l = S.settings.tr; if (!l || l === 'none') return;
      m3.textContent = t('downloading'); downloadTranslation(l).then(function () { toast(t('ready')); render(); }).catch(function (e) { m3.textContent = t('failed') + ': ' + errMsg(e); }); return;
    }
    if (a === 'dlAll') {
      if (!S.Q) return toast(t('needQuran'));
      var m4 = $('#dlmsg'); (async function () { try { for (var s = 1; s <= 114; s++) { await downloadSurahAudio(s, function (k, n) { m4.textContent = t('downloading') + ' ' + s + '/114 · ' + k + '/' + n; }); } toast(t('downloaded')); render(); } catch (e) { m4.textContent = t('failed'); } })(); return;
    }
    if (a === 'clearAudio') { if (confirm(t('confirmDel'))) DB.clear('audio').then(function () { S.audioSet = new Set(); render(); }); return; }
    if (a === 'exportAll') {
      var data = JSON.stringify({ app: 'quran-car-backup', settings: S.settings, progress: S.progress, duas: S.duas, wird: W() });
      var file = new File([data], 'quran-car-backup.json', { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) navigator.share({ files: [file] }).catch(function () { });
      else { var u = URL.createObjectURL(file), aa = document.createElement('a'); aa.href = u; aa.download = file.name; aa.click(); setTimeout(function () { URL.revokeObjectURL(u); }, 1000); }
      return;
    }
    if (a === 'importAll') {
      var inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'application/json,.json';
      inp.onchange = function () { var f = inp.files[0]; if (!f) return; f.text().then(function (txt) { try { var o = JSON.parse(txt); if (o.app !== 'quran-car-backup') throw 0; var idMap = {}; if (Array.isArray(o.duas)) { S.duas = o.duas.map(function (d) { var nid = uid(); idMap[String(d.id)] = nid; return { id: nid, title: String(d.title || ''), text: String(d.text || ''), tr: String(d.tr || ''), count: QE.clamp(parseInt(d.count, 10) || 1, 1, 1000), when: ['morning', 'evening', 'anytime'].indexOf(d.when) >= 0 ? d.when : 'anytime' }; }); saveDuas(); } if (o.progress && typeof o.progress === 'object') { S.progress = cleanProgress(o.progress); saveProgress(); } if (o.wird && Array.isArray(o.wird.parts)) { S.wird = cleanWird(o.wird, idMap); saveWird(); } toast(t('imported')); render(); } catch (e) { toast(t('failed')); } }); };
      inp.click(); return;
    }
    if (a === 'miniOpen') { $('#drive').hidden = false; var cs = SP.on ? SP.curStep() : Player.curStep(); if (cs) ui.playerStep(cs); return; }
    if (a === 'driveClose') { $('#drive').hidden = true; return; }
    if (a === 'pp') { if (TTS.on) { TTS.stop(); ui.playerHide(); return; } if (SP.on) return SP.toggle(); return Player.toggle(); }
    if (a === 'next') return SP.on ? SP.jump(1) : Player.jump(1);
    if (a === 'prev') return SP.on ? SP.jump(-1) : Player.jump(-1);
    if (a === 'stop') { playGroup.run = (playGroup.run || 0) + 1; TTS.stop(); SP.stop(false); Player.stop(false); return; }
    if (a === 'ttsTest') { if (SP.on) SP.pause(); SP.unlock(); SP.speak('سُبْحَانَ اللَّهِ وَبِحَمْدِهِ', +S.settings.speed || 1); return; }
  });

  document.addEventListener('input', function (e) {
    var id = e.target.id;
    if (id === 'qsearch') { S.view.q = e.target.value; var pos = e.target.selectionStart; render(); var el = $('#qsearch'); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (x) { } } }
    if (id === 'o-gap') { S.settings.gapSeconds = Math.round(+e.target.value * 10) / 10; $('#o-gapv').textContent = S.settings.gapSeconds; saveSettings(); return; }
    if (false) {  /* legacy */ S.settings.gapSeconds = +e.target.value; $('#o-gapv').textContent = e.target.value; saveSettings(); }
    if (id === 's-font') { S.settings.fontScale = +e.target.value; saveSettings(); applyTheme(); }
  });
  document.addEventListener('change', function (e) {
    var id = e.target.id, v = e.target.value, st = S.settings;
    if (id === 'o-from' || id === 'o-to') { S.view.from = +$('#o-from').value; S.view.to = +$('#o-to').value; S.view.anchor = null; return render(); }
    if (id === 'o-rep') { st.repeatEach = +v; saveSettings(); }
    if (id === 'o-pieces') { st.pieces = +v; saveSettings(); }
    if (id === 'o-speed') { st.speed = +v; saveSettings(); }
    if (id === 'o-rounds') { st.rounds = +v; saveSettings(); }
    if (id === 'o-rec' || id === 's-rec') { st.reciter = v; if (reciter().kbps.indexOf(+st.kbps) < 0) st.kbps = reciter().kbps[0]; saveSettings(); render(); }
    if (id === 's-kbps') { st.kbps = +v; saveSettings(); }
    if (id === 's-tts') { st.ttsVoice = v; saveSettings(); }
    if (id === 'o-reconly') { st.recOnly = !!e.target.checked; saveSettings(); }
    if (id === 's-lang') { st.lang = v; saveSettings(); render(); }
    if (id === 's-tr') { st.tr = v; saveSettings(); if (v !== 'none' && !S.TR[v]) { DB.get('kv', 'tr:' + v).then(function (d) { if (d) { S.TR[v] = d; render(); } else toast(t('download') + ' → ' + t('translation')); }); } render(); }
    if (id === 's-theme') { st.theme = v; saveSettings(); applyTheme(); }
    if (id === 's-m1' || id === 's-m2' || id === 's-e1' || id === 's-e2') { st.morning = { from: $('#s-m1').value, to: $('#s-m2').value }; st.evening = { from: $('#s-e1').value, to: $('#s-e2').value }; saveSettings(); }
  });
  document.querySelectorAll('#tabs button').forEach(function (b) { b.addEventListener('click', function () { tab(b.dataset.tab); }); });

  /* ================= boot ================= */
  async function boot() {
    root = $('#view'); Player.init();
    try { await loadQuranLocal(); } catch (e) { }
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () { });
    render();
    // incoming share link
    if (location.hash.indexOf('#share=') === 0) {
      var list = null; try { list = QE.decodeShare(QE.b64urlDecode(location.hash.slice(7))); } catch (e) { }
      history.replaceState(null, '', location.pathname + location.search);
      if (list && list.length && confirm((LANG === 'ar' ? 'استيراد ' : 'Import ') + list.length + (LANG === 'ar' ? ' دعاء؟' : ' duas?'))) {
        list.forEach(function (d) { S.duas.push(Object.assign({ id: uid() }, d)); }); saveDuas(); toast(t('imported')); render();
      }
    }
    var lastDay = QE.dayKey();
    function dayTick() { var d = QE.dayKey(); if (d !== lastDay) { lastDay = d; if (['wird', 'wq', 'group'].indexOf(S.view.name) >= 0) render(); } }
    setInterval(function () { if (document.hidden) return; dayTick(); if (S.view.name === 'today') render(); }, 60000);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) { dayTick(); if (S.view.name === 'today') render(); } });
    if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) navigator.serviceWorker.register('sw.js').then(function (reg) {
      document.addEventListener('visibilitychange', function () { if (!document.hidden) { try { var up = reg.update(); if (up && up.catch) up.catch(function () { }); } catch (e) { } } });
    }).catch(function () { });
  }
  window.__app = { S: S, Player: Player, render: render, go: go, VC: VC, Dict: Dict, Rec: Rec };
  boot();
})();
</script>
