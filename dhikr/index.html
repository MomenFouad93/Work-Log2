<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d6b52">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ذكر">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>ذكر - Dhikr</title>
<style>:root{--bg:#f6f4ec;--card:#ffffff;--ink:#17231e;--mut:#62706a;--pri:#1d6b52;--pri2:#e4f1ec;--acc:#b8892b;--ok:#2e8b57;--warn:#b5532a;--line:#e2ded0;--fs:1}
:root[data-theme=dark]{--bg:#0f1512;--card:#18211d;--ink:#e8efe9;--mut:#93a39b;--pri:#52c29b;--pri2:#1c3329;--acc:#d9ad4e;--ok:#5bd08a;--warn:#e88a5c;--line:#26332d}
@media(prefers-color-scheme:dark){:root[data-theme=auto]{--bg:#0f1512;--card:#18211d;--ink:#e8efe9;--mut:#93a39b;--pri:#52c29b;--pri2:#1c3329;--acc:#d9ad4e;--ok:#5bd08a;--warn:#e88a5c;--line:#26332d}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"SF Pro Text","Segoe UI",system-ui,"Geeza Pro",Tahoma,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
body.hasmini{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
#view{max-width:720px;margin:0 auto;padding:12px 14px}
.top{display:flex;align-items:center;gap:8px;margin:6px 0 4px}
.top h1{font-size:22px;margin:0;flex:1}
h2{font-size:17px;margin:20px 0 8px;color:var(--pri)}
.sub{color:var(--mut);margin:0 0 10px;font-size:14px}
.muted{color:var(--mut)}.small{font-size:13px}.center{text-align:center}
.ib{width:44px;height:44px;border:0;border-radius:12px;background:var(--pri2);color:var(--pri);font-size:26px;line-height:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.card.g{cursor:pointer}
.card.complete{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 8%,var(--card))}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.row b{font-size:18px}
.bar{height:8px;background:var(--pri2);border-radius:6px;margin:10px 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri);border-radius:6px}
.stwrap{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.st{padding:10px 12px;border-radius:12px;background:var(--pri2);font-size:15px}
.st.ok{background:color-mix(in srgb,var(--ok) 18%,var(--card));color:var(--ok);font-weight:600}
.st.now{background:color-mix(in srgb,var(--acc) 22%,var(--card))}
.st.warn{background:color-mix(in srgb,var(--warn) 18%,var(--card));color:var(--warn)}
.btn{min-height:46px;padding:0 18px;border:0;border-radius:14px;background:var(--pri);color:#fff;font-size:16px;font-weight:600}
:root[data-theme=dark] .btn{color:#06130d}
.btn.sm{min-height:40px;padding:0 14px;font-size:15px}
.btn.ghost{background:var(--pri2);color:var(--pri)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.btnrow .btn{flex:1;min-width:120px}
.item .ar{font-size:calc(26px*var(--fs))}
.ar{font-family:"KFGQPC Uthman Taha Naskh","Geeza Pro","Traditional Arabic","Amiri",serif;font-size:calc(28px*var(--fs));line-height:2.1;text-align:right}
.ar.sm{font-size:calc(20px*var(--fs));line-height:1.9}
.tr{color:var(--mut);font-size:calc(15px*var(--fs));margin-top:4px}
.ttl{font-weight:700;margin-bottom:4px}
.ctr{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.count{flex:1;min-width:110px;min-height:56px;border:2px solid var(--pri);border-radius:16px;background:var(--pri2);color:var(--pri);font-size:24px;font-weight:700}
.item.complete .count{background:var(--ok);border-color:var(--ok);color:#fff}
.srow{display:flex;align-items:center;gap:12px;padding:12px 14px}
.srow .grow{flex:1}.srow small{display:block;color:var(--mut)}
.num{width:38px;height:38px;border-radius:50%;background:var(--pri2);color:var(--pri);display:flex;align-items:center;justify-content:center;font-weight:700}
.chip{font-size:13px;color:var(--ok)}
.search,.form input,.form textarea,.form select,.opts input,.opts select{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-size:16px;font-family:inherit}
.search{margin:8px 0}
.form label,.opts label{display:block;margin:10px 0 4px;font-size:14px;color:var(--mut)}
.form label input,.form label select,.form label textarea,.opts label input,.opts label select{margin-top:4px;color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:6px;margin:6px 0}
.seg button{flex:1;min-height:42px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-size:15px}
.seg button.on{background:var(--pri);border-color:var(--pri);color:#fff}
:root[data-theme=dark] .seg button.on{color:#06130d}
.seg.sm button{min-height:38px;font-size:14px}
input[type=range]{padding:0;min-height:36px}
.ay{display:flex;gap:10px;padding:10px 6px;border-bottom:1px solid var(--line);cursor:pointer;opacity:.62}
.ay.in{opacity:1;background:color-mix(in srgb,var(--pri) 6%,transparent)}
.ay.cur{background:color-mix(in srgb,var(--acc) 22%,transparent);opacity:1}
.ay .n{min-width:30px;color:var(--pri);font-weight:700;padding-top:10px}
.ay .ar{flex:1}
#tabs{position:fixed;bottom:0;inset-inline:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20}
#tabs button{flex:1;min-height:60px;border:0;background:none;color:var(--mut);font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
#tabs button i{font-style:normal;font-size:22px}
#tabs button.on{color:var(--pri);font-weight:700}
#mini{position:fixed;inset-inline:8px;bottom:calc(66px + env(safe-area-inset-bottom));background:var(--pri);color:#fff;border-radius:18px;display:flex;align-items:center;gap:6px;padding:6px 8px;z-index:25;box-shadow:0 6px 20px rgba(0,0,0,.25)}
:root[data-theme=dark] #mini{color:#06130d}
#mini[hidden],#drive[hidden]{display:none}
#mini-t{flex:1;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:8px 6px;cursor:pointer}
#mini button,#drive .ctl button{border:0;background:rgba(255,255,255,.2);color:inherit;border-radius:14px;min-width:46px;min-height:46px;font-size:20px}
#drive{position:fixed;inset:0;background:var(--bg);z-index:40;display:flex;flex-direction:column;padding:14px;padding-top:calc(14px + env(safe-area-inset-top));padding-bottom:calc(14px + env(safe-area-inset-bottom))}
#drive .dtop{display:flex;align-items:center;gap:8px}
#d-title{flex:1;font-weight:700;font-size:18px}
#drive .body{flex:1;overflow:auto;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:12px}
#d-text{font-family:"KFGQPC Uthman Taha Naskh","Geeza Pro","Traditional Arabic",serif;font-size:calc(34px*var(--fs));line-height:2.1;direction:rtl}
#d-tr{color:var(--mut);font-size:calc(17px*var(--fs))}
#d-rep{font-size:20px;color:var(--pri);font-weight:700}
.gapind{display:inline-block;padding:10px 18px;border-radius:30px;font-size:20px;font-weight:700;align-self:center}
.gapind.turn{background:var(--acc);color:#1a1200}
.gapind.listen{background:var(--pri2);color:var(--pri)}
#drive .ctl{display:flex;gap:12px;justify-content:center;padding-top:8px}
#drive .ctl button{background:var(--pri2);color:var(--pri);min-width:84px;min-height:84px;font-size:34px;border-radius:24px}
#drive .ctl button#d-pp{background:var(--pri);color:#fff;min-width:110px}
:root[data-theme=dark] #drive .ctl button#d-pp{color:#06130d}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));background:#222;color:#fff;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:90%}
#toast.show{opacity:.95}

.diag{white-space:pre-wrap;word-break:break-all;direction:ltr;text-align:left;font:12px/1.5 ui-monospace,Menlo,monospace;background:var(--pri2);border-radius:12px;padding:10px;margin:8px 0}
.diag:empty{display:none}

#vc{position:fixed;inset:0;background:var(--bg);z-index:45;display:flex;flex-direction:column;padding:14px;padding-top:calc(14px + env(safe-area-inset-top));padding-bottom:calc(14px + env(safe-area-inset-bottom));overflow:auto}
#vc[hidden]{display:none}
#vc .dtop{display:flex;align-items:center;gap:8px}
#vc-t{flex:1;font-weight:700;font-size:16px;line-height:1.6}
#vc .body{flex:1;display:flex;flex-direction:column;gap:14px;justify-content:center;text-align:center}
#vc-n{font-size:64px;font-weight:800;color:var(--pri);font-variant-numeric:tabular-nums}
#vc-n.flash{animation:vcf .35s ease}
#vc-n.fin{color:#2e9d6a}
@keyframes vcf{0%{transform:scale(1.25)}100%{transform:scale(1)}}
#vc-lvl{position:relative;height:14px;border-radius:7px;background:var(--pri2);overflow:hidden}
#vc-lvl i{position:absolute;inset:0 auto 0 0;width:0;background:#8fb8a8;transition:width .05s}
#vc-lvl.sp i{background:var(--pri)}
#vc-lvl b{position:absolute;top:0;bottom:0;width:2px;background:#d9534f}
[dir=rtl] #vc-lvl{direction:ltr}
#vc-st{min-height:1.6em;color:var(--mut,#777)}
.vcctl{display:flex;gap:10px;justify-content:center}
.vcctl .btn{min-height:52px}
#vc-go{flex:1;max-width:240px;font-size:17px}
#vc-opts{text-align:start}
body.vcopen #mini,body.vcopen #tabs{display:none}
.btn.vcb{white-space:nowrap}
.form .lbl{display:flex;align-items:center;justify-content:space-between;gap:8px}
.btn.mic.on{background:#d9534f;color:#fff;border-color:#d9534f}
.recrow{display:flex;flex-direction:column;gap:6px}
.form .lbl{margin:10px 0 4px;font-size:14px;color:var(--mut)}
.form>textarea{width:100%}
#vc-opts label{display:block;margin:8px 0 4px;font-size:14px;color:var(--mut)}

.card.wq .st{font-weight:600;margin:6px 0}
.row.wx{font-size:14px;padding:4px 0;border-top:1px solid var(--line)}
.row.wx span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
h2.sh{text-align:center;color:var(--pri);margin:18px 0 6px}
.card.sm{padding:8px 12px;margin:6px 0;font-size:14px}
label.chk{display:flex;align-items:center;gap:8px}
label.chk input{width:auto;min-height:0}
#tabs button span{font-size:11px}

#d-text mark{background:#f6e7b4;color:inherit;border-radius:6px;padding:0 4px}
</style>
</head>
<body>
<div id="view"></div>

<div id="mini" hidden>
  <button data-act="stop" aria-label="stop">✕</button>
  <div id="mini-t" data-act="miniOpen"></div>
  <button data-act="prev" aria-label="previous">⏮</button>
  <button id="mini-pp" data-act="pp" aria-label="play pause">▶</button>
  <button data-act="next" aria-label="next">⏭</button>
</div>

<div id="drive" hidden>
  <div class="dtop"><div id="d-title"></div><button class="ib" data-act="driveClose" aria-label="close">✕</button></div>
  <div class="body">
    <div id="d-rep"></div>
    <div id="d-text"></div>
    <div id="d-tr"></div>
    <div id="d-gap" class="gapind listen"></div>
  </div>
  <div class="ctl">
    <button data-act="prev" aria-label="previous">⏮</button>
    <button id="d-pp" data-act="pp" aria-label="play pause">▶</button>
    <button data-act="next" aria-label="next">⏭</button>
  </div>
</div>

<div id="vc" hidden>
  <div class="dtop"><div id="vc-t"></div><button class="ib" data-act="vcClose" aria-label="close">✕</button></div>
  <div class="body">
    <div id="vc-n" dir="ltr">0 / 0</div>
    <div id="vc-lvl"><i></i><b></b></div>
    <div id="vc-st"></div>
    <div class="vcctl"><button class="btn ghost" data-act="vcMinus">−1</button><button id="vc-go" class="btn" data-act="vcGo"></button><button class="btn ghost" data-act="vcPlus">+1</button></div>
    <div id="vc-opts" class="form"></div>
  </div>
</div>

<nav id="tabs">
  <button data-tab="today"><i>☀</i><span></span></button>
  <button data-tab="wird"><i>📿</i><span></span></button>
  <button data-tab="quran"><i>📖</i><span></span></button>
  <button data-tab="library"><i>🤲</i><span></span></button>
  <button data-tab="settings"><i>⚙</i><span></span></button>
</nav>
<div id="toast"></div>
<audio id="au" preload="auto" playsinline></audio>

<script>window.ADHKAR={"version": 1, "meta": {"numbering_note": "Hadith numbers follow the Hisn al-Muslim edition (Bukhari/Muslim numbers as in Fath al-Bari / Abd al-Baqi). Quran text is NOT stored here: load from Tanzil by ref.", "tr_note": "All fr/ur translations are needs-review. tr_en_reviewed=true marks English cross-checked against the sunnah.com English meaning; other English is own wording, still to be checked by a reader."}, "groups": [{"id": "morning", "names": {"ar": "أذكار الصباح", "en": "Morning Adhkar", "fr": "Invocations du matin", "ur": "صبح کے اذکار"}, "window": "morning", "items": [{"id": "m01", "kind": "quran", "ref": "2:255", "count": 1, "source": "الحاكم 1/562؛ صححه الألباني (صحيح الترغيب 1/273)", "grade": "quran", "note": {"ar": "آية الكرسي: من قالها حين يصبح أُجير من الجن حتى يمسي، ومن قالها حين يمسي أُجير حتى يصبح.", "en": "Ayat al-Kursi, recited morning and evening (Hakim)."}}, {"id": "m02", "kind": "quran", "ref": "112:1-4", "count": 3, "source": "أبو داود 5082؛ الترمذي 3575", "grade": "quran", "note": {"ar": "سورة الإخلاص، ثلاث مرات صباحًا ومساءً.", "en": "Surat al-Ikhlas, three times morning and evening."}}, {"id": "m03", "kind": "quran", "ref": "113:1-5", "count": 3, "source": "أبو داود 5082؛ الترمذي 3575", "grade": "quran", "note": {"ar": "سورة الفلق، ثلاث مرات صباحًا ومساءً.", "en": "Surat al-Falaq, three times morning and evening."}}, {"id": "m04", "kind": "quran", "ref": "114:1-6", "count": 3, "source": "أبو داود 5082؛ الترمذي 3575", "grade": "quran", "note": {"ar": "سورة الناس، ثلاث مرات صباحًا ومساءً.", "en": "Surat an-Nas, three times morning and evening."}}, {"id": "m05", "kind": "text", "ar": "أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذَا الْيَوْمِ وَخَيْرَ مَا بَعْدَهُ، وَأَعُوذُ بِكَ مِنْ شَرِّ هَذَا الْيَوْمِ وَشَرِّ مَا بَعْدَهُ، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ", "tr": {"en": "We have entered the morning and all dominion belongs to Allah, and praise is for Allah. There is no god but Allah alone, with no partner. His is the dominion and His is the praise, and He has power over everything. My Lord, I ask You for the good of this day and the good of what comes after it, and I seek refuge in You from the evil of this day and the evil of what comes after it. My Lord, I seek refuge in You from laziness and the misery of old age. My Lord, I seek refuge in You from punishment in the Fire and punishment in the grave.", "fr": "Nous voici au matin, et la royauté appartient à Allah, et la louange est à Allah. Il n'y a de dieu qu'Allah, Seul, sans associé. À Lui la royauté, à Lui la louange, et Il est puissant sur toute chose. Seigneur, je Te demande le bien de ce jour et le bien de ce qui vient après, et je me réfugie auprès de Toi contre le mal de ce jour et le mal de ce qui vient après. Seigneur, je me réfugie auprès de Toi contre la paresse et la mauvaise vieillesse. Seigneur, je me réfugie auprès de Toi contre un châtiment dans le Feu et un châtiment dans la tombe.", "ur": "ہم نے صبح کی اور بادشاہی اللہ ہی کی ہے، اور تمام تعریف اللہ کے لیے ہے۔ اللہ کے سوا کوئی معبود نہیں، وہ اکیلا ہے، اس کا کوئی شریک نہیں۔ اسی کی بادشاہی ہے، اسی کی تعریف ہے اور وہ ہر چیز پر قادر ہے۔ اے میرے رب! میں تجھ سے اس دن کی بھلائی اور اس کے بعد کی بھلائی مانگتا ہوں، اور اس دن کی برائی اور اس کے بعد کی برائی سے تیری پناہ چاہتا ہوں۔ اے میرے رب! میں سستی اور بڑھاپے کی خرابی سے تیری پناہ چاہتا ہوں۔ اے میرے رب! میں آگ کے عذاب اور قبر کے عذاب سے تیری پناہ چاہتا ہوں۔"}, "count": 1, "source": "مسلم 2723", "grade": "sahih", "tr_status": "needs-review", "note": {"ar": "يختلف لفظ الصباح عن المساء: أصبحنا/أمسينا، وهذا اليوم/هذه الليلة.", "en": "Wording differs morning vs evening: asbahna/amsayna, this day/this night."}, "variant": true, "pair": "e05"}, {"id": "m06", "kind": "text", "ar": "اللَّهُمَّ بِكَ أَصْبَحْنَا، وَبِكَ أَمْسَيْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ النُّشُورُ", "tr": {"en": "O Allah, by You we have reached the morning, by You we reach the evening, by You we live and by You we die, and to You is the resurrection.", "fr": "Ô Allah, par Toi nous voici au matin, par Toi nous voici au soir, par Toi nous vivons et par Toi nous mourons, et vers Toi est la résurrection.", "ur": "اے اللہ! تیرے ہی (حکم و توفیق) سے ہم نے صبح کی، تیرے ہی سے ہم نے شام کی، تیرے ہی سے ہم جیتے ہیں اور تیرے ہی سے مرتے ہیں، اور تیری ہی طرف دوبارہ اٹھ کر جانا ہے۔"}, "count": 1, "source": "الترمذي 3391", "grade": "hasan", "tr_status": "needs-review", "note": {"ar": "يختلف اللفظ: صباحًا «وإليك النشور» ومساءً «وإليك المصير».", "en": "Differs: morning ends 'and to You is the resurrection', evening 'and to You is the final return'."}, "variant": true, "pair": "e06", "tr_en_reviewed": true}, {"id": "m07", "kind": "text", "ar": "اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ", "tr": {"en": "O Allah, You are my Lord; there is no god but You. You created me and I am Your servant, and I keep Your covenant and promise as best I can. I seek refuge in You from the evil of what I have done. I acknowledge Your favour upon me and I acknowledge my sin, so forgive me, for none forgives sins except You.", "fr": "Ô Allah, Tu es mon Seigneur ; il n'y a de dieu que Toi. Tu m'as créé et je suis Ton serviteur, et je me tiens à Ton engagement et à Ta promesse autant que je le peux. Je me réfugie auprès de Toi contre le mal de ce que j'ai commis. Je reconnais Ton bienfait envers moi et je reconnais mon péché ; pardonne-moi, car nul ne pardonne les péchés en dehors de Toi.", "ur": "اے اللہ! تو میرا رب ہے، تیرے سوا کوئی معبود نہیں۔ تو نے مجھے پیدا کیا اور میں تیرا بندہ ہوں، اور اپنی استطاعت کے مطابق تیرے عہد اور وعدے پر قائم ہوں۔ جو کچھ میں نے کیا اس کے شر سے تیری پناہ چاہتا ہوں۔ میں اپنے اوپر تیری نعمت کا اعتراف کرتا ہوں اور اپنے گناہ کا اعتراف کرتا ہوں، پس مجھے بخش دے، کیونکہ تیرے سوا کوئی گناہ نہیں بخشتا۔"}, "count": 1, "source": "البخاري 6306", "grade": "sahih", "tr_status": "needs-review", "note": {"ar": "سيد الاستغفار؛ نفس اللفظ صباحًا ومساءً. من قاله موقنًا به حين يمسي فمات من ليلته دخل الجنة، وكذلك حين يصبح.", "en": "Sayyid al-Istighfar; same wording morning and evening. Whoever says it with conviction and dies that day/night enters Paradise (Bukhari)."}, "variant": false, "pair": "e07", "tr_en_reviewed": true, "audio": "a/h79.mp3"}, {"id": "m10", "kind": "text", "ar": "اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي، لَا إِلَهَ إِلَّا أَنْتَ. اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْكُفْرِ، وَالْفَقْرِ، وَأَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ، لَا إِلَهَ إِلَّا أَنْتَ", "tr": {"en": "O Allah, grant me well-being in my body. O Allah, grant me well-being in my hearing. O Allah, grant me well-being in my sight. There is no god but You. O Allah, I seek refuge in You from disbelief and poverty, and I seek refuge in You from the punishment of the grave. There is no god but You.", "fr": "Ô Allah, accorde-moi la santé dans mon corps. Ô Allah, accorde-moi la santé dans mon ouïe. Ô Allah, accorde-moi la santé dans ma vue. Il n'y a de dieu que Toi. Ô Allah, je me réfugie auprès de Toi contre la mécréance et la pauvreté, et je me réfugie auprès de Toi contre le châtiment de la tombe. Il n'y a de dieu que Toi.", "ur": "اے اللہ! مجھے میرے بدن میں عافیت دے۔ اے اللہ! مجھے میری سماعت میں عافیت دے۔ اے اللہ! مجھے میری بینائی میں عافیت دے۔ تیرے سوا کوئی معبود نہیں۔ اے اللہ! میں کفر اور فقر سے تیری پناہ چاہتا ہوں، اور قبر کے عذاب سے تیری پناہ چاہتا ہوں۔ تیرے سوا کوئی معبود نہیں۔"}, "count": 3, "source": "أبو داود 5092؛ أحمد", "grade": "hasan", "tr_status": "needs-review", "note": {"ar": "ثلاث مرات صباحًا ومساءً.", "en": "Three times, morning and evening."}, "variant": false, "pair": "e10"}, {"id": "m11", "kind": "text", "ar": "اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ، اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي دِينِي وَدُنْيَايَ وَأَهْلِي وَمَالِي، اللَّهُمَّ اسْتُرْ عَوْرَاتِي وَآمِنْ رَوْعَاتِي، اللَّهُمَّ احْفَظْنِي مِنْ بَيْنِ يَدَيَّ وَمِنْ خَلْفِي وَعَنْ يَمِينِي وَعَنْ شِمَالِي، وَمِنْ فَوْقِي، وَأَعُوذُ بِعَظَمَتِكَ أَنْ أُغْتَالَ مِنْ تَحْتِي", "tr": {"en": "O Allah, I ask You for well-being in this world and the Hereafter. O Allah, I ask You for pardon and well-being in my religion, my worldly life, my family and my wealth. O Allah, conceal my faults and calm my fears. O Allah, protect me from in front of me and from behind me, from my right and from my left and from above me, and I seek refuge in Your greatness from being struck down from beneath me.", "fr": "Ô Allah, je Te demande le bien-être en ce bas monde et dans l'au-delà. Ô Allah, je Te demande le pardon et le bien-être dans ma religion, ma vie ici-bas, ma famille et mes biens. Ô Allah, couvre mes défauts et apaise mes craintes. Ô Allah, protège-moi par devant, par derrière, à ma droite, à ma gauche et par au-dessus, et je me réfugie dans Ta grandeur contre le fait d'être englouti par en dessous.", "ur": "اے اللہ! میں تجھ سے دنیا اور آخرت میں عافیت مانگتا ہوں۔ اے اللہ! میں تجھ سے اپنے دین، اپنی دنیا، اپنے گھر والوں اور اپنے مال میں معافی اور عافیت مانگتا ہوں۔ اے اللہ! میرے عیبوں پر پردہ ڈال دے اور میری گھبراہٹوں کو امن میں بدل دے۔ اے اللہ! میرے آگے سے، میرے پیچھے سے، میرے دائیں سے، میرے بائیں سے اور میرے اوپر سے میری حفاظت فرما، اور میں تیری عظمت کی پناہ چاہتا ہوں کہ میں نیچے سے اچانک ہلاک کر دیا جاؤں۔"}, "count": 1, "source": "أبو داود 5074؛ ابن ماجه 3871", "grade": "sahih", "tr_status": "needs-review", "variant": false, "pair": "e11"}, {"id": "m12", "kind": "text", "ar": "اللَّهُمَّ عَالِمَ الْغَيْبِ وَالشَّهَادَةِ فَاطِرَ السَّمَاوَاتِ وَالْأَرْضِ، رَبَّ كُلِّ شَيْءٍ وَمَلِيكَهُ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا أَنْتَ، أَعُوذُ بِكَ مِنْ شَرِّ نَفْسِي وَمِنْ شَرِّ الشَّيْطَانِ وَشِرْكِهِ، وَأَنْ أَقْتَرِفَ عَلَى نَفْسِي سُوءًا أَوْ أَجُرَّهُ إِلَى مُسْلِمٍ", "tr": {"en": "O Allah, Knower of the unseen and the seen, Originator of the heavens and the earth, Lord and Sovereign of everything: I bear witness that there is no god but You. I seek refuge in You from the evil of my own self, from the evil of Satan and his polytheism, and from doing wrong against myself or bringing it upon a Muslim.", "fr": "Ô Allah, Connaisseur de l'invisible et du visible, Créateur des cieux et de la terre, Seigneur et Souverain de toute chose : j'atteste qu'il n'y a de dieu que Toi. Je me réfugie auprès de Toi contre le mal de mon âme, contre le mal de Satan et son polythéisme, et contre le fait de commettre un tort envers moi-même ou de l'attirer sur un musulman.", "ur": "اے اللہ! غیب اور حاضر کے جاننے والے، آسمانوں اور زمین کے پیدا کرنے والے، ہر چیز کے رب اور اس کے مالک! میں گواہی دیتا ہوں کہ تیرے سوا کوئی معبود نہیں۔ میں اپنے نفس کے شر سے، شیطان کے شر اور اس کے شرک (کی دعوت) سے، اور اس بات سے تیری پناہ چاہتا ہوں کہ میں اپنے آپ پر کوئی برائی کماؤں یا اسے کسی مسلمان کی طرف کھینچ لاؤں۔"}, "count": 1, "source": "الترمذي 3392؛ أبو داود 5067", "grade": "sahih", "tr_status": "needs-review", "variant": false, "pair": "e12", "audio": "a/h85.mp3"}, {"id": "m13", "kind": "text", "ar": "بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ", "tr": {"en": "In the name of Allah, with whose name nothing on earth or in the heavens can cause harm, and He is the All-Hearing, the All-Knowing.", "fr": "Au nom d'Allah, avec le nom de Qui rien sur terre ni dans le ciel ne peut nuire, et Il est l'Audient, l'Omniscient.", "ur": "اللہ کے نام سے، جس کے نام کے ساتھ زمین و آسمان میں کوئی چیز نقصان نہیں پہنچا سکتی، اور وہی خوب سننے والا، خوب جاننے والا ہے۔"}, "count": 3, "source": "أبو داود 5088؛ الترمذي 3388؛ ابن ماجه 3869", "grade": "sahih", "tr_status": "needs-review", "variant": false, "pair": "e13", "audio": "a/h86.mp3"}, {"id": "m14", "kind": "text", "ar": "رَضِيتُ بِاللَّهِ رَبًّا، وَبِالْإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ نَبِيًّا", "tr": {"en": "I am pleased with Allah as my Lord, with Islam as my religion, and with Muhammad as my Prophet.", "fr": "Je suis satisfait d'Allah comme Seigneur, de l'Islam comme religion et de Muhammad comme prophète.", "ur": "میں اللہ کے رب ہونے، اسلام کے دین ہونے اور محمد ﷺ کے نبی ہونے پر راضی ہوں۔"}, "count": 3, "source": "أحمد 18967؛ الترمذي 3389", "grade": "hasan", "tr_status": "needs-review", "variant": false, "pair": "e14"}, {"id": "m15", "kind": "text", "ar": "يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغِيثُ، أَصْلِحْ لِي شَأْنِي كُلَّهُ، وَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ", "tr": {"en": "O Ever-Living, O Self-Sustaining, in Your mercy I seek help. Set right all my affairs, and do not leave me to myself even for the blink of an eye.", "fr": "Ô Vivant, ô Subsistant par Lui-même, c'est par Ta miséricorde que j'implore secours. Rends bon tout mon état et ne me laisse pas à moi-même, ne serait-ce que le temps d'un clin d'œil.", "ur": "اے زندہ! اے قائم رکھنے والے! تیری رحمت کے وسیلے سے میں مدد مانگتا ہوں۔ میرے سارے کام سنوار دے اور پلک جھپکنے کی دیر کے لیے بھی مجھے میرے نفس کے حوالے نہ کر۔"}, "count": 1, "source": "الحاكم 1/545", "grade": "hasan", "tr_status": "needs-review", "variant": false, "pair": "e15", "audio": "a/h88.mp3"}, {"id": "m17", "kind": "text", "ar": "أَصْبَحْنَا عَلَى فِطْرَةِ الْإِسْلَامِ، وَعَلَى كَلِمَةِ الْإِخْلَاصِ، وَعَلَى دِينِ نَبِيِّنَا مُحَمَّدٍ، وَعَلَى مِلَّةِ أَبِينَا إِبْرَاهِيمَ حَنِيفًا مُسْلِمًا وَمَا كَانَ مِنَ الْمُشْرِكِينَ", "tr": {"en": "We have entered the morning upon the natural religion of Islam, upon the word of sincere devotion, upon the religion of our Prophet Muhammad, and upon the way of our father Ibrahim, upright and submitting to Allah, and he was not of the polytheists.", "fr": "Nous voici au matin sur la nature originelle de l'Islam, sur la parole de pure sincérité, sur la religion de notre Prophète Muhammad et sur la voie de notre père Ibrahim, hanif et soumis, qui n'était pas du nombre des polythéistes.", "ur": "ہم نے صبح کی اسلام کی فطرت پر، کلمۂ اخلاص پر، اپنے نبی محمد ﷺ کے دین پر اور اپنے باپ ابراہیم کی ملت پر، جو یکسو مسلم تھے اور مشرکوں میں سے نہ تھے۔"}, "count": 1, "source": "أحمد 15360", "grade": "sahih", "tr_status": "needs-review", "note": {"ar": "يختلف اللفظ: أصبحنا/أمسينا.", "en": "Differs: asbahna/amsayna."}, "variant": true, "pair": "e17"}, {"id": "m18", "kind": "text", "ar": "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ", "tr": {"en": "Glory be to Allah and praise Him.", "fr": "Gloire à Allah et louange à Lui.", "ur": "اللہ پاک ہے اور اسی کی حمد ہے۔"}, "count": 100, "source": "مسلم 2692", "grade": "sahih", "tr_status": "needs-review", "note": {"ar": "مائة مرة في الصباح (ومثله في المساء).", "en": "One hundred times."}, "audio": "a/h91.mp3"}, {"id": "m19", "kind": "text", "ar": "لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ", "tr": {"en": "There is no god but Allah alone, with no partner. His is the dominion and His is the praise, and He has power over everything.", "fr": "Il n'y a de dieu qu'Allah, Seul, sans associé. À Lui la royauté, à Lui la louange, et Il est puissant sur toute chose.", "ur": "اللہ کے سوا کوئی معبود نہیں، وہ اکیلا ہے، اس کا کوئی شریک نہیں۔ اسی کی بادشاہی ہے، اسی کی تعریف ہے اور وہ ہر چیز پر قادر ہے۔"}, "count": 10, "source": "أبو داود 5077؛ النسائي؛ ابن ماجه 3798", "grade": "sahih", "tr_status": "needs-review", "note": {"ar": "عشر مرات.", "en": "Ten times."}, "audio": "a/h93.mp3"}, {"id": "m20", "kind": "text", "ar": "لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ", "tr": {"en": "There is no god but Allah alone, with no partner. His is the dominion and His is the praise, and He has power over everything.", "fr": "Il n'y a de dieu qu'Allah, Seul, sans associé. À Lui la royauté, à Lui la louange, et Il est puissant sur toute chose.", "ur": "اللہ کے سوا کوئی معبود نہیں، وہ اکیلا ہے، اس کا کوئی شریک نہیں۔ اسی کی بادشاہی ہے، اسی کی تعریف ہے اور وہ ہر چیز پر قادر ہے۔"}, "count": 100, "source": "البخاري 3293؛ مسلم 2691", "grade": "sahih", "tr_status": "needs-review", "note": {"ar": "مائة مرة في اليوم (حصن المسلم يذكرها في أذكار الصباح).", "en": "One hundred times in the day (Hisn lists it with the morning adhkar)."}, "audio": "a/h93.mp3"}, {"id": "m21", "kind": "text", "ar": "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ عَدَدَ خَلْقِهِ، وَرِضَا نَفْسِهِ، وَزِنَةَ عَرْشِهِ، وَمِدَادَ كَلِمَاتِهِ", "tr": {"en": "Glory be to Allah and praise Him, as many times as the number of His creation, as much as pleases Him, as much as the weight of His Throne, and as much as the ink of His words.", "fr": "Gloire à Allah et louange à Lui, autant que le nombre de Sa création, autant qu'il Lui agrée, autant que le poids de Son Trône et autant que l'encre de Ses paroles.", "ur": "اللہ پاک ہے اور اسی کی حمد ہے، اس کی مخلوق کی تعداد کے برابر، اس کی رضا کے برابر، اس کے عرش کے وزن کے برابر اور اس کے کلمات کی سیاہی کے برابر۔"}, "count": 3, "source": "مسلم 2726", "grade": "sahih", "tr_status": "needs-review", "note": {"ar": "ثلاث مرات؛ حديث جويرية بعد صلاة الصبح.", "en": "Three times; hadith of Juwayriya, after Fajr."}}, {"id": "m22", "kind": "text", "ar": "اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْمًا نَافِعًا، وَرِزْقًا طَيِّبًا، وَعَمَلًا مُتَقَبَّلًا", "tr": {"en": "O Allah, I ask You for beneficial knowledge, good provision, and accepted deeds.", "fr": "Ô Allah, je Te demande une science utile, une subsistance pure et des œuvres acceptées.", "ur": "اے اللہ! میں تجھ سے نفع بخش علم، پاکیزہ رزق اور مقبول عمل مانگتا ہوں۔"}, "count": 1, "source": "ابن ماجه 925", "grade": "hasan", "tr_status": "needs-review", "note": {"ar": "بعد السلام من صلاة الفجر.", "en": "After the salam of Fajr prayer."}, "audio": "a/h95.mp3"}, {"id": "m23", "kind": "text", "ar": "أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ", "tr": {"en": "I seek Allah's forgiveness and I repent to Him.", "fr": "Je demande pardon à Allah et je me repens à Lui.", "ur": "میں اللہ سے مغفرت مانگتا ہوں اور اسی کی طرف توبہ کرتا ہوں۔"}, "count": 100, "source": "البخاري 6307؛ مسلم 2702", "grade": "sahih", "tr_status": "needs-review", "note": {"ar": "مائة مرة في اليوم كله، وليس صباحًا ومساءً معًا (البخاري: أكثر من سبعين).", "en": "100 times in the whole day, not 100 in the morning and 100 in the evening (Bukhari: more than seventy)."}, "audio": "a/h96.mp3"}]}, {"id": "evening", "names": {"ar": "أذكار المساء", "en": "Evening Adhkar", "fr": "Invocations du soir", "ur": "شام کے اذکار"}, "window": "evening", "items": [{"id": "e01", "kind": "quran", "ref": "2:255", "count": 1, "source": "الحاكم 1/562؛ صححه الألباني (صحيح الترغيب 1/273)", "grade": "quran", "note": {"ar": "آية الكرسي: من قالها حين يصبح أُجير من الجن حتى يمسي، ومن قالها حين يمسي أُجير حتى يصبح.", "en": "Ayat al-Kursi, recited morning and evening (Hakim)."}}, {"id": "e02", "kind": "quran", "ref": "112:1-4", "count": 3, "source": "أبو داود 5082؛ الترمذي 3575", "grade": "quran", "note": {"ar": "سورة الإخلاص، ثلاث مرات صباحًا ومساءً.", "en": "Surat al-Ikhlas, three times morning and evening."}}, {"id": "e03", "kind": "quran", "ref": "113:1-5", "count": 3, "source": "أبو داود 5082؛ الترمذي 3575", "grade": "quran", "note": {"ar": "سورة الفلق، ثلاث مرات صباحًا ومساءً.", "en": "Surat al-Falaq, three times morning and evening."}}, {"id": "e04", "kind": "quran", "ref": "114:1-6", "count": 3, "source": "أبو داود 5082؛ الترمذي 3575", "grade": "quran", "note": {"ar": "سورة الناس، ثلاث مرات صباحًا ومساءً.", "en": "Surat an-Nas, three times morning and evening."}}, {"id": "e05", "kind": "text", "ar": "أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذِهِ اللَّيْلَةِ وَخَيْرَ مَا بَعْدَهَا، وَأَعُوذُ بِكَ مِنْ شَرِّ هَذِهِ اللَّيْلَةِ وَشَرِّ مَا بَعْدَهَا، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ", "tr": {"en": "We have entered the evening and all dominion belongs to Allah, and praise is for Allah. There is no god but Allah alone, with no partner. His is the dominion and His is the praise, and He has power over everything. My Lord, I ask You for the good of this night and the good of what comes after it, and I seek refuge in You from the evil of this night and the evil of what comes after it. My Lord, I seek refuge in You from laziness and the misery of old age. My Lord, I seek refuge in You from punishment in the Fire and punishment in the grave.", "fr": "Nous voici au soir, et la royauté appartient à Allah, et la louange est à Allah. Il n'y a de dieu qu'Allah, Seul, sans associé. À Lui la royauté, à Lui la louange, et Il est puissant sur toute chose. Seigneur, je Te demande le bien de cette nuit et le bien de ce qui vient après, et je me réfugie auprès de Toi contre le mal de cette nuit et le mal de ce qui vient après. Seigneur, je me réfugie auprès de Toi contre la paresse et la mauvaise vieillesse. Seigneur, je me réfugie auprès de Toi contre un châtiment dans le Feu et un châtiment dans la tombe.", "ur": "ہم نے شام کی اور بادشاہی اللہ ہی کی ہے، اور تمام تعریف اللہ کے لیے ہے۔ اللہ کے سوا کوئی معبود نہیں، وہ اکیلا ہے، اس کا کوئی شریک نہیں۔ اسی کی بادشاہی ہے، اسی کی تعریف ہے اور وہ ہر چیز پر قادر ہے۔ اے میرے رب! میں تجھ سے اس رات کی بھلائی اور اس کے بعد کی بھلائی مانگتا ہوں، اور اس رات کی برائی اور اس کے بعد کی برائی سے تیری پناہ چاہتا ہوں۔ اے میرے رب! میں سستی اور بڑھاپے کی خرابی سے تیری پناہ چاہتا ہوں۔ اے میرے رب! میں آگ کے عذاب اور قبر کے عذاب سے تیری پناہ چاہتا ہوں۔"}, "count": 1, "source": "مسلم 2723", "grade": "sahih", "tr_status": "needs-review", "note": {"ar": "يختلف لفظ الصباح عن المساء: أصبحنا/أمسينا، وهذا اليوم/هذه الليلة.", "en": "Wording differs morning vs evening: asbahna/amsayna, this day/this night."}, "variant": true, "pair": "m05"}, {"id": "e06", "kind": "text", "ar": "اللَّهُمَّ بِكَ أَمْسَيْنَا، وَبِكَ أَصْبَحْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ الْمَصِيرُ", "tr": {"en": "O Allah, by You we have reached the evening, by You we reach the morning, by You we live and by You we die, and to You is the final return.", "fr": "Ô Allah, par Toi nous voici au soir, par Toi nous voici au matin, par Toi nous vivons et par Toi nous mourons, et vers Toi est le retour final.", "ur": "اے اللہ! تیرے ہی (حکم و توفیق) سے ہم نے شام کی، تیرے ہی سے ہم نے صبح کی، تیرے ہی سے ہم جیتے ہیں اور تیرے ہی سے مرتے ہیں، اور تیری ہی طرف لوٹ کر جانا ہے۔"}, "count": 1, "source": "الترمذي 3391", "grade": "hasan", "tr_status": "needs-review", "note": {"ar": "يختلف اللفظ: صباحًا «وإليك النشور» ومساءً «وإليك المصير».", "en": "Differs: morning ends 'and to You is the resurrection', evening 'and to You is the final return'."}, "variant": true, "pair": "m06", "tr_en_reviewed": true}, {"id": "e07", "kind": "text", "ar": "اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ", "tr": {"en": "O Allah, You are my Lord; there is no god but You. You created me and I am Your servant, and I keep Your covenant and promise as best I can. I seek refuge in You from the evil of what I have done. I acknowledge Your favour upon me and I acknowledge my sin, so forgive me, for none forgives sins except You.", "fr": "Ô Allah, Tu es mon Seigneur ; il n'y a de dieu que Toi. Tu m'as créé et je suis Ton serviteur, et je me tiens à Ton engagement et à Ta promesse autant que je le peux. Je me réfugie auprès de Toi contre le mal de ce que j'ai commis. Je reconnais Ton bienfait envers moi et je reconnais mon péché ; pardonne-moi, car nul ne pardonne les péchés en dehors de Toi.", "ur": "اے اللہ! تو میرا رب ہے، تیرے سوا کوئی معبود نہیں۔ تو نے مجھے پیدا کیا اور میں تیرا بندہ ہوں، اور اپنی استطاعت کے مطابق تیرے عہد اور وعدے پر قائم ہوں۔ جو کچھ میں نے کیا اس کے شر سے تیری پناہ چاہتا ہوں۔ میں اپنے اوپر تیری نعمت کا اعتراف کرتا ہوں اور اپنے گناہ کا اعتراف کرتا ہوں، پس مجھے بخش دے، کیونکہ تیرے سوا کوئی گناہ نہیں بخشتا۔"}, "count": 1, "source": "البخاري 6306", "grade": "sahih", "tr_status": "needs-review", "note": {"ar": "سيد الاستغفار؛ نفس اللفظ صباحًا ومساءً. من قاله موقنًا به حين يمسي فمات من ليلته دخل الجنة، وكذلك حين يصبح.", "en": "Sayyid al-Istighfar; same wording morning and evening. Whoever says it with conviction and dies that day/night enters Paradise (Bukhari)."}, "variant": false, "pair": "m07", "tr_en_reviewed": true, "audio": "a/h79.mp3"}, {"id": "e10", "kind": "text", "ar": "اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي، لَا إِلَهَ إِلَّا أَنْتَ. اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْكُفْرِ، وَالْفَقْرِ، وَأَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ، لَا إِلَهَ إِلَّا أَنْتَ", "tr": {"en": "O Allah, grant me well-being in my body. O Allah, grant me well-being in my hearing. O Allah, grant me well-being in my sight. There is no god but You. O Allah, I seek refuge in You from disbelief and poverty, and I seek refuge in You from the punishment of the grave. There is no god but You.", "fr": "Ô Allah, accorde-moi la santé dans mon corps. Ô Allah, accorde-moi la santé dans mon ouïe. Ô Allah, accorde-moi la santé dans ma vue. Il n'y a de dieu que Toi. Ô Allah, je me réfugie auprès de Toi contre la mécréance et la pauvreté, et je me réfugie auprès de Toi contre le châtiment de la tombe. Il n'y a de dieu que Toi.", "ur": "اے اللہ! مجھے میرے بدن میں عافیت دے۔ اے اللہ! مجھے میری سماعت میں عافیت دے۔ اے اللہ! مجھے میری بینائی میں عافیت دے۔ تیرے سوا کوئی معبود نہیں۔ اے اللہ! میں کفر اور فقر سے تیری پناہ چاہتا ہوں، اور قبر کے عذاب سے تیری پناہ چاہتا ہوں۔ تیرے سوا کوئی معبود نہیں۔"}, "count": 3, "source": "أبو داود 5092؛ أحمد", "grade": "hasan", "tr_status": "needs-review", "note": {"ar": "ثلاث مرات صباحًا ومساءً.", "en": "Three times, morning and evening."}, "variant": false, "pair": "m10"}, {"id": "e11", "kind": "text", "ar": "اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ، اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي دِينِي وَدُنْيَايَ وَأَهْلِي وَمَالِي، اللَّهُمَّ اسْتُرْ عَوْرَاتِي وَآمِنْ رَوْعَاتِي، اللَّهُمَّ احْفَظْنِي مِنْ بَيْنِ يَدَيَّ وَمِنْ خَلْفِي وَعَنْ يَمِينِي وَعَنْ شِمَالِي، وَمِنْ فَوْقِي، وَأَعُوذُ بِعَظَمَتِكَ أَنْ أُغْتَالَ مِنْ تَحْتِي", "tr": {"en": "O Allah, I ask You for well-being in this world and the Hereafter. O Allah, I ask You for pardon and well-being in my religion, my worldly life, my family and my wealth. O Allah, conceal my faults and calm my fears. O Allah, protect me from in front of me and from behind me, from my right and from my left and from above me, and I seek refuge in Your greatness from being struck down from beneath me.", "fr": "Ô Allah, je Te demande le bien-être en ce bas monde et dans l'au-delà. Ô Allah, je Te demande le pardon et le bien-être dans ma religion, ma vie ici-bas, ma famille et mes biens. Ô Allah, couvre mes défauts et apaise mes craintes. Ô Allah, protège-moi par devant, par derrière, à ma droite, à ma gauche et par au-dessus, et je me réfugie dans Ta grandeur contre le fait d'être englouti par en dessous.", "ur": "اے اللہ! میں تجھ سے دنیا اور آخرت میں عافیت مانگتا ہوں۔ اے اللہ! میں تجھ سے اپنے دین، اپنی دنیا، اپنے گھر والوں اور اپنے مال میں معافی اور عافیت مانگتا ہوں۔ اے اللہ! میرے عیبوں پر پردہ ڈال دے اور میری گھبراہٹوں کو امن میں بدل دے۔ اے اللہ! میرے آگے سے، میرے پیچھے سے، میرے دائیں سے، میرے بائیں سے اور میرے اوپر سے میری حفاظت فرما، اور میں تیری عظمت کی پناہ چاہتا ہوں کہ میں نیچے سے اچانک ہلاک کر دیا جاؤں۔"}, "count": 1, "source": "أبو داود 5074؛ ابن ماجه 3871", "grade": "sahih", "tr_status": "needs-review", "variant": false, "pair": "m11"}, {"id": "e12", "kind": "text", "ar": "اللَّهُمَّ عَالِمَ الْغَيْبِ وَالشَّهَادَةِ فَاطِرَ السَّمَاوَاتِ وَالْأَرْضِ، رَبَّ كُلِّ شَيْءٍ وَمَلِيكَهُ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا أَنْتَ، أَعُوذُ بِكَ مِنْ شَرِّ نَفْسِي وَمِنْ شَرِّ الشَّيْطَانِ وَشِرْكِهِ، وَأَنْ أَقْتَرِفَ عَلَى نَفْسِي سُوءًا أَوْ أَجُرَّهُ إِلَى مُسْلِمٍ", "tr": {"en": "O Allah, Knower of the unseen and the seen, Originator of the heavens and the earth, Lord and Sovereign of everything: I bear witness that there is no god but You. I seek refuge in You from the evil of my own self, from the evil of Satan and his polytheism, and from doing wrong against myself or bringing it upon a Muslim.", "fr": "Ô Allah, Connaisseur de l'invisible et du visible, Créateur des cieux et de la terre, Seigneur et Souverain de toute chose : j'atteste qu'il n'y a de dieu que Toi. Je me réfugie auprès de Toi contre le mal de mon âme, contre le mal de Satan et son polythéisme, et contre le fait de commettre un tort envers moi-même ou de l'attirer sur un musulman.", "ur": "اے اللہ! غیب اور حاضر کے جاننے والے، آسمانوں اور زمین کے پیدا کرنے والے، ہر چیز کے رب اور اس کے مالک! میں گواہی دیتا ہوں کہ تیرے سوا کوئی معبود نہیں۔ میں اپنے نفس کے شر سے، شیطان کے شر اور اس کے شرک (کی دعوت) سے، اور اس بات سے تیری پناہ چاہتا ہوں کہ میں اپنے آپ پر کوئی برائی کماؤں یا اسے کسی مسلمان کی طرف کھینچ لاؤں۔"}, "count": 1, "source": "الترمذي 3392؛ أبو داود 5067", "grade": "sahih", "tr_status": "needs-review", "variant": false, "pair": "m12", "audio": "a/h85.mp3"}, {"id": "e13", "kind": "text", "ar": "بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ", "tr": {"en": "In the name of Allah, with whose name nothing on earth or in the heavens can cause harm, and He is the All-Hearing, the All-Knowing.", "fr": "Au nom d'Allah, avec le nom de Qui rien sur terre ni dans le ciel ne peut nuire, et Il est l'Audient, l'Omniscient.", "ur": "اللہ کے نام سے، جس کے نام کے ساتھ زمین و آسمان میں کوئی چیز نقصان نہیں پہنچا سکتی، اور وہی خوب سننے والا، خوب جاننے والا ہے۔"}, "count": 3, "source": "أبو داود 5088؛ الترمذي 3388؛ ابن ماجه 3869", "grade": "sahih", "tr_status": "needs-review", "variant": false, "pair": "m13", "audio": "a/h86.mp3"}, {"id": "e14", "kind": "text", "ar": "رَضِيتُ بِاللَّهِ رَبًّا، وَبِالْإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ نَبِيًّا", "tr": {"en": "I am pleased with Allah as my Lord, with Islam as my religion, and with Muhammad as my Prophet.", "fr": "Je suis satisfait d'Allah comme Seigneur, de l'Islam comme religion et de Muhammad comme prophète.", "ur": "میں اللہ کے رب ہونے، اسلام کے دین ہونے اور محمد ﷺ کے نبی ہونے پر راضی ہوں۔"}, "count": 3, "source": "أحمد 18967؛ الترمذي 3389", "grade": "hasan", "tr_status": "needs-review", "variant": false, "pair": "m14"}, {"id": "e15", "kind": "text", "ar": "يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغِيثُ، أَصْلِحْ لِي شَأْنِي كُلَّهُ، وَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ", "tr": {"en": "O Ever-Living, O Self-Sustaining, in Your mercy I seek help. Set right all my affairs, and do not leave me to myself even for the blink of an eye.", "fr": "Ô Vivant, ô Subsistant par Lui-même, c'est par Ta miséricorde que j'implore secours. Rends bon tout mon état et ne me laisse pas à moi-même, ne serait-ce que le temps d'un clin d'œil.", "ur": "اے زندہ! اے قائم رکھنے والے! تیری رحمت کے وسیلے سے میں مدد مانگتا ہوں۔ میرے سارے کام سنوار دے اور پلک جھپکنے کی دیر کے لیے بھی مجھے میرے نفس کے حوالے نہ کر۔"}, "count": 1, "source": "الحاكم 1/545", "grade": "hasan", "tr_status": "needs-review", "variant": false, "pair": "m15", "audio": "a/h88.mp3"}, {"id": "e17", "kind": "text", "ar": "أَمْسَيْنَا عَلَى فِطْرَةِ الْإِسْلَامِ، وَعَلَى كَلِمَةِ الْإِخْلَاصِ، وَعَلَى دِينِ نَبِيِّنَا مُحَمَّدٍ، وَعَلَى مِلَّةِ أَبِينَا إِبْرَاهِيمَ حَنِيفًا مُسْلِمًا وَمَا كَانَ مِنَ الْمُشْرِكِينَ", "tr": {"en": "We have entered the evening upon the natural religion of Islam, upon the word of sincere devotion, upon the religion of our Prophet Muhammad, and upon the way of our father Ibrahim, upright and submitting to Allah, and he was not of the polytheists.", "fr": "Nous voici au soir sur la nature originelle de l'Islam, sur la parole de pure sincérité, sur la religion de notre Prophète Muhammad et sur la voie de notre père Ibrahim, hanif et soumis, qui n'était pas du nombre des polythéistes.", "ur": "ہم نے شام کی اسلام کی فطرت پر، کلمۂ اخلاص پر، اپنے نبی محمد ﷺ کے دین پر اور اپنے باپ ابراہیم کی ملت پر، جو یکسو مسلم تھے اور مشرکوں میں سے نہ تھے۔"}, "count": 1, "source": "أحمد 15360", "grade": "sahih", "tr_status": "needs-review", "note": {"ar": "يختلف اللفظ: أصبحنا/أمسينا.", "en": "Differs: asbahna/amsayna."}, "variant": true, "pair": "m17"}, {"id": "e18", "kind": "text", "ar": "أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ", "tr": {"en": "I seek refuge in the perfect words of Allah from the evil of what He has created.", "fr": "Je me réfugie dans les paroles parfaites d'Allah contre le mal de ce qu'Il a créé.", "ur": "میں اللہ کے کامل کلمات کی پناہ چاہتا ہوں ہر اس چیز کے شر سے جو اس نے پیدا کی۔"}, "count": 3, "source": "مسلم 2709؛ الترمذي وأبو داود (للتثليث مساءً)", "grade": "hasan", "tr_status": "needs-review", "note": {"ar": "ثلاثًا إذا أمسى.", "en": "Three times in the evening."}}, {"id": "e19", "kind": "quran", "ref": "2:285-286", "count": 1, "source": "البخاري 5009؛ مسلم 807", "grade": "quran", "note": {"ar": "من قرأ بالآيتين من آخر سورة البقرة في ليلة كفتاه.", "en": "Last two verses of al-Baqarah: whoever recites them at night, they suffice him (Bukhari, Muslim)."}}, {"id": "e20", "kind": "text", "ar": "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ", "tr": {"en": "Glory be to Allah and praise Him.", "fr": "Gloire à Allah et louange à Lui.", "ur": "اللہ پاک ہے اور اسی کی حمد ہے۔"}, "count": 100, "source": "مسلم 2692", "grade": "sahih", "tr_status": "needs-review", "audio": "a/h91.mp3"}, {"id": "e21", "kind": "text", "ar": "لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ", "tr": {"en": "There is no god but Allah alone, with no partner. His is the dominion and His is the praise, and He has power over everything.", "fr": "Il n'y a de dieu qu'Allah, Seul, sans associé. À Lui la royauté, à Lui la louange, et Il est puissant sur toute chose.", "ur": "اللہ کے سوا کوئی معبود نہیں، وہ اکیلا ہے، اس کا کوئی شریک نہیں۔ اسی کی بادشاہی ہے، اسی کی تعریف ہے اور وہ ہر چیز پر قادر ہے۔"}, "count": 10, "source": "أبو داود 5077؛ النسائي؛ ابن ماجه 3798", "grade": "sahih", "tr_status": "needs-review", "audio": "a/h93.mp3"}]}, {"id": "after-prayer", "names": {"ar": "الأذكار بعد الصلاة", "en": "After the Prayer", "fr": "Après la prière", "ur": "نماز کے بعد کے اذکار"}, "window": "anytime", "items": [{"id": "p01", "kind": "text", "ar": "أَسْتَغْفِرُ اللَّهَ", "tr": {"en": "I seek Allah's forgiveness.", "fr": "Je demande pardon à Allah.", "ur": "میں اللہ سے مغفرت مانگتا ہوں۔"}, "count": 3, "source": "مسلم 591", "grade": "sahih", "tr_status": "needs-review", "note": {"ar": "ثلاث مرات بعد السلام.", "en": "Three times right after the salam."}}, {"id": "p02", "kind": "text", "ar": "اللَّهُمَّ أَنْتَ السَّلَامُ، وَمِنْكَ السَّلَامُ، تَبَارَكْتَ يَا ذَا الْجَلَالِ وَالْإِكْرَامِ", "tr": {"en": "O Allah, You are Peace and from You comes peace. Blessed are You, O Possessor of majesty and honour.", "fr": "Ô Allah, Tu es la Paix et de Toi vient la paix. Béni sois-Tu, ô Détenteur de la majesté et de la générosité.", "ur": "اے اللہ! تو سلامتی والا ہے اور تجھی سے سلامتی ہے، تو بڑی برکت والا ہے، اے جلال اور اکرام والے۔"}, "count": 1, "source": "مسلم 591", "grade": "sahih", "tr_status": "needs-review"}, {"id": "p03", "kind": "text", "ar": "لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، اللَّهُمَّ لَا مَانِعَ لِمَا أَعْطَيْتَ، وَلَا مُعْطِيَ لِمَا مَنَعْتَ، وَلَا يَنْفَعُ ذَا الْجَدِّ مِنْكَ الْجَدُّ", "tr": {"en": "There is no god but Allah alone, with no partner. His is the dominion and His is the praise, and He has power over everything. O Allah, none can withhold what You give, none can give what You withhold, and no fortune benefits the fortunate against You.", "fr": "Il n'y a de dieu qu'Allah, Seul, sans associé. À Lui la royauté, à Lui la louange, et Il est puissant sur toute chose. Ô Allah, nul ne peut retenir ce que Tu donnes, nul ne peut donner ce que Tu retiens, et la fortune du fortuné ne lui sert à rien contre Toi.", "ur": "اللہ کے سوا کوئی معبود نہیں، وہ اکیلا ہے، اس کا کوئی شریک نہیں۔ اسی کی بادشاہی ہے، اسی کی تعریف ہے اور وہ ہر چیز پر قادر ہے۔ اے اللہ! جو تو دے اسے کوئی روکنے والا نہیں، جو تو روک لے اسے کوئی دینے والا نہیں، اور کسی صاحبِ حیثیت کو اس کی حیثیت تیرے مقابلے میں نفع نہیں دیتی۔"}, "count": 1, "source": "البخاري 844؛ مسلم 593", "grade": "sahih", "tr_status": "needs-review"}, {"id": "p04", "kind": "text", "ar": "لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَلَا نَعْبُدُ إِلَّا إِيَّاهُ، لَهُ النِّعْمَةُ وَلَهُ الْفَضْلُ وَلَهُ الثَّنَاءُ الْحَسَنُ، لَا إِلَهَ إِلَّا اللَّهُ مُخْلِصِينَ لَهُ الدِّينَ وَلَوْ كَرِهَ الْكَافِرُونَ", "tr": {"en": "There is no god but Allah alone, with no partner; His is the dominion and His is the praise, and He has power over everything. There is no power and no strength except with Allah. There is no god but Allah, and we worship none but Him. His are the favour, the grace and the finest praise. There is no god but Allah; we are sincere to Him in religion, even if the disbelievers dislike it.", "fr": "Il n'y a de dieu qu'Allah, Seul, sans associé ; à Lui la royauté, à Lui la louange, et Il est puissant sur toute chose. Il n'y a de puissance ni de force qu'en Allah. Il n'y a de dieu qu'Allah et nous n'adorons que Lui. À Lui le bienfait, à Lui la grâce et à Lui la plus belle louange. Il n'y a de dieu qu'Allah ; nous Lui vouons un culte sincère, même si les mécréants le détestent.", "ur": "اللہ کے سوا کوئی معبود نہیں، وہ اکیلا ہے، اس کا کوئی شریک نہیں؛ اسی کی بادشاہی ہے، اسی کی تعریف ہے اور وہ ہر چیز پر قادر ہے۔ نہ گناہ سے بچنے کی طاقت ہے نہ نیکی کی قوت مگر اللہ ہی کی مدد سے۔ اللہ کے سوا کوئی معبود نہیں اور ہم اسی کے سوا کسی کی عبادت نہیں کرتے۔ اسی کی نعمت ہے، اسی کا فضل ہے اور اسی کے لیے بہترین ثنا ہے۔ اللہ کے سوا کوئی معبود نہیں، ہم دین کو اسی کے لیے خالص کرتے ہیں چاہے کافروں کو برا لگے۔"}, "count": 1, "source": "مسلم 594", "grade": "sahih", "tr_status": "needs-review", "audio": "a/h68.mp3"}, {"id": "p05", "kind": "text", "ar": "سُبْحَانَ اللَّهِ", "tr": {"en": "Glory be to Allah.", "fr": "Gloire à Allah.", "ur": "اللہ پاک ہے۔"}, "count": 33, "source": "مسلم 597", "grade": "sahih", "tr_status": "needs-review", "note": {"ar": "التسبيح ثلاثًا وثلاثين.", "en": "Tasbih, thirty-three times."}}, {"id": "p06", "kind": "text", "ar": "الْحَمْدُ لِلَّهِ", "tr": {"en": "All praise is for Allah.", "fr": "Louange à Allah.", "ur": "تمام تعریف اللہ کے لیے ہے۔"}, "count": 33, "source": "مسلم 597", "grade": "sahih", "tr_status": "needs-review", "note": {"ar": "التحميد ثلاثًا وثلاثين.", "en": "Tahmid, thirty-three times."}}, {"id": "p07", "kind": "text", "ar": "اللَّهُ أَكْبَرُ", "tr": {"en": "Allah is the Greatest.", "fr": "Allah est le Plus Grand.", "ur": "اللہ سب سے بڑا ہے۔"}, "count": 33, "source": "مسلم 597", "grade": "sahih", "tr_status": "needs-review", "note": {"ar": "التكبير ثلاثًا وثلاثين (وفي رواية أربعًا وثلاثين).", "en": "Takbir, thirty-three times (another narration: thirty-four)."}, "audio": "a/h241.mp3"}, {"id": "p08", "kind": "text", "ar": "لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ", "tr": {"en": "There is no god but Allah alone, with no partner. His is the dominion and His is the praise, and He has power over everything.", "fr": "Il n'y a de dieu qu'Allah, Seul, sans associé. À Lui la royauté, à Lui la louange, et Il est puissant sur toute chose.", "ur": "اللہ کے سوا کوئی معبود نہیں، وہ اکیلا ہے، اس کا کوئی شریک نہیں۔ اسی کی بادشاہی ہے، اسی کی تعریف ہے اور وہ ہر چیز پر قادر ہے۔"}, "count": 1, "source": "مسلم 597", "grade": "sahih", "tr_status": "needs-review", "note": {"ar": "تمام المائة، بعد التسبيح والتحميد والتكبير.", "en": "Completes the hundred after the tasbih, tahmid and takbir."}, "audio": "a/h93.mp3"}, {"id": "p09", "kind": "quran", "ref": "2:255", "count": 1, "source": "النسائي في السنن الكبرى (عمل اليوم والليلة 100)؛ صححه الألباني", "grade": "quran", "note": {"ar": "آية الكرسي دبر كل صلاة مكتوبة.", "en": "Ayat al-Kursi after every obligatory prayer (Nasa'i; graded sahih by al-Albani)."}}, {"id": "p10", "kind": "quran", "ref": "112:1-4", "count": 1, "source": "أبو داود 1523؛ الترمذي 2903؛ النسائي 1335", "grade": "quran", "note": {"ar": "المعوذات دبر كل صلاة، مرة واحدة (أبو داود 1523).", "en": "Al-Mu'awwidhat once after each prayer (Abu Dawud 1523)."}}, {"id": "p11", "kind": "quran", "ref": "113:1-5", "count": 1, "source": "أبو داود 1523؛ الترمذي 2903؛ النسائي 1335", "grade": "quran", "note": {"ar": "المعوذات دبر كل صلاة.", "en": "Al-Mu'awwidhat after each prayer."}}, {"id": "p12", "kind": "quran", "ref": "114:1-6", "count": 1, "source": "أبو داود 1523؛ الترمذي 2903؛ النسائي 1335", "grade": "quran", "note": {"ar": "المعوذات دبر كل صلاة.", "en": "Al-Mu'awwidhat after each prayer."}}]}, {"id": "before-sleep", "names": {"ar": "أذكار النوم", "en": "Before Sleep", "fr": "Avant de dormir", "ur": "سونے سے پہلے کے اذکار"}, "window": "anytime", "items": [{"id": "s01", "kind": "quran", "ref": "2:255", "count": 1, "source": "البخاري 2311", "grade": "quran", "note": {"ar": "آية الكرسي عند النوم: لا يزال عليك من الله حافظ ولا يقربك شيطان حتى تصبح.", "en": "Ayat al-Kursi at bedtime: a guardian from Allah stays with you and no devil comes near until morning (Bukhari)."}, "tr_en_reviewed": true}, {"id": "s02", "kind": "quran", "ref": "112:1-4", "count": 3, "source": "البخاري 5017", "grade": "quran", "note": {"ar": "يجمع كفيه وينفث فيهما ويقرأ الإخلاص والمعوذتين ثم يمسح بهما ما استطاع من جسده، ثلاث مرات.", "en": "Cup the palms, blow into them, recite Ikhlas, Falaq and Nas, then wipe over the body; repeat three times (Bukhari)."}, "tr_en_reviewed": true}, {"id": "s03", "kind": "quran", "ref": "113:1-5", "count": 3, "source": "البخاري 5017", "grade": "quran", "note": {"ar": "ضمن الفعل نفسه مع الإخلاص والناس.", "en": "Part of the same practice with Ikhlas and Nas."}, "tr_en_reviewed": true}, {"id": "s04", "kind": "quran", "ref": "114:1-6", "count": 3, "source": "البخاري 5017", "grade": "quran", "note": {"ar": "ضمن الفعل نفسه مع الإخلاص والفلق.", "en": "Part of the same practice with Ikhlas and Falaq."}, "tr_en_reviewed": true}, {"id": "s05", "kind": "quran", "ref": "2:285-286", "count": 1, "source": "البخاري 5009؛ مسلم 807", "grade": "quran", "note": {"ar": "الآيتان من آخر سورة البقرة: من قرأ بهما في ليلة كفتاه.", "en": "The last two verses of al-Baqarah: whoever recites them at night, they suffice him."}, "tr_en_reviewed": true}, {"id": "s06", "kind": "text", "ar": "بِاسْمِكَ رَبِّي وَضَعْتُ جَنْبِي، وَبِكَ أَرْفَعُهُ، فَإِنْ أَمْسَكْتَ نَفْسِي فَارْحَمْهَا، وَإِنْ أَرْسَلْتَهَا فَاحْفَظْهَا بِمَا تَحْفَظُ بِهِ عِبَادَكَ الصَّالِحِينَ", "tr": {"en": "In Your name, my Lord, I lay down my side, and by You I raise it. If You take my soul, have mercy on it; and if You release it, protect it as You protect Your righteous servants.", "fr": "En Ton nom, mon Seigneur, j'ai posé mon flanc, et par Toi je le relèverai. Si Tu retiens mon âme, fais-lui miséricorde ; et si Tu la renvoies, protège-la comme Tu protèges Tes serviteurs vertueux.", "ur": "اے میرے رب! تیرے نام سے میں نے اپنا پہلو رکھا اور تیرے ہی (نام و توفیق) سے اسے اٹھاؤں گا۔ اگر تو میری جان روک لے تو اس پر رحم فرما، اور اگر چھوڑ دے تو اس کی حفاظت فرما جیسے تو اپنے نیک بندوں کی حفاظت کرتا ہے۔"}, "count": 1, "source": "البخاري 6320؛ مسلم 2714", "grade": "sahih", "tr_status": "needs-review", "tr_en_reviewed": true, "audio": "a/h102.mp3"}, {"id": "s07", "kind": "text", "ar": "بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا", "tr": {"en": "In Your name, O Allah, I die and I live.", "fr": "En Ton nom, ô Allah, je meurs et je vis.", "ur": "اے اللہ! تیرے ہی نام سے میں مرتا اور جیتا ہوں۔"}, "count": 1, "source": "البخاري 6324", "grade": "sahih", "tr_status": "needs-review", "audio": "a/h105.mp3"}, {"id": "s08", "kind": "text", "ar": "اللَّهُمَّ أَسْلَمْتُ نَفْسِي إِلَيْكَ، وَفَوَّضْتُ أَمْرِي إِلَيْكَ، وَوَجَّهْتُ وَجْهِي إِلَيْكَ، وَأَلْجَأْتُ ظَهْرِي إِلَيْكَ، رَغْبَةً وَرَهْبَةً إِلَيْكَ، لَا مَلْجَأَ وَلَا مَنْجَا مِنْكَ إِلَّا إِلَيْكَ، آمَنْتُ بِكِتَابِكَ الَّذِي أَنْزَلْتَ، وَبِنَبِيِّكَ الَّذِي أَرْسَلْتَ", "tr": {"en": "O Allah, I have submitted myself to You, entrusted my affairs to You, turned my face to You and relied upon You, out of hope and fear of You. There is no refuge and no escape from You except to You. I believe in Your Book which You revealed and in Your Prophet whom You sent.", "fr": "Ô Allah, je me suis soumis à Toi, je T'ai confié mon affaire, j'ai tourné mon visage vers Toi et je me suis adossé à Toi, par désir et par crainte de Toi. Il n'est de refuge ni de salut contre Toi qu'auprès de Toi. J'ai cru en Ton Livre que Tu as révélé et en Ton Prophète que Tu as envoyé.", "ur": "اے اللہ! میں نے اپنی جان تیرے سپرد کر دی، اپنا معاملہ تیرے حوالے کر دیا، اپنا رخ تیری طرف کر لیا اور اپنی پشت تیرے سہارے پر لگا دی، تیری رغبت اور تیرے خوف کے ساتھ۔ تجھ سے بچنے کی کوئی پناہ گاہ اور نجات کی جگہ نہیں سوائے تیری ہی طرف۔ میں تیری اس کتاب پر ایمان لایا جو تو نے نازل کی اور تیرے اس نبی پر جسے تو نے بھیجا۔"}, "count": 1, "source": "البخاري 6311؛ مسلم 2710", "grade": "sahih", "tr_status": "needs-review", "tr_en_reviewed": true, "note": {"ar": "بعد الوضوء والاضطجاع على الشق الأيمن؛ من قالها ثم مات من ليلته مات على الفطرة.", "en": "After wudu, lying on the right side; whoever says it and dies that night dies upon the fitrah."}, "audio": "a/h111.mp3"}, {"id": "s09", "kind": "text", "ar": "اللَّهُمَّ إِنَّكَ خَلَقْتَ نَفْسِي وَأَنْتَ تَوَفَّاهَا، لَكَ مَمَاتُهَا وَمَحْيَاهَا، إِنْ أَحْيَيْتَهَا فَاحْفَظْهَا، وَإِنْ أَمَتَّهَا فَاغْفِرْ لَهَا. اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَافِيَةَ", "tr": {"en": "O Allah, You created my soul and You take it back; its death and its life are Yours. If You give it life, protect it; and if You cause it to die, forgive it. O Allah, I ask You for well-being.", "fr": "Ô Allah, Tu as créé mon âme et c'est Toi qui la rappelles ; sa mort et sa vie T'appartiennent. Si Tu lui donnes la vie, protège-la ; et si Tu la fais mourir, pardonne-lui. Ô Allah, je Te demande le bien-être.", "ur": "اے اللہ! تو نے میری جان کو پیدا کیا اور تو ہی اسے وفات دیتا ہے، اس کی موت اور اس کی زندگی تیرے ہی لیے ہے۔ اگر تو اسے زندہ رکھے تو اس کی حفاظت فرما، اور اگر موت دے تو اسے بخش دے۔ اے اللہ! میں تجھ سے عافیت مانگتا ہوں۔"}, "count": 1, "source": "مسلم 2712", "grade": "sahih", "tr_status": "needs-review", "tr_en_reviewed": true, "audio": "a/h103.mp3"}, {"id": "s10", "kind": "text", "ar": "اللَّهُمَّ رَبَّ السَّمَاوَاتِ السَّبْعِ وَرَبَّ الْأَرْضِ وَرَبَّ الْعَرْشِ الْعَظِيمِ، رَبَّنَا وَرَبَّ كُلِّ شَيْءٍ، فَالِقَ الْحَبِّ وَالنَّوَى، وَمُنَزِّلَ التَّوْرَاةِ وَالْإِنْجِيلِ وَالْفُرْقَانِ، أَعُوذُ بِكَ مِنْ شَرِّ كُلِّ شَيْءٍ أَنْتَ آخِذٌ بِنَاصِيَتِهِ. اللَّهُمَّ أَنْتَ الْأَوَّلُ فَلَيْسَ قَبْلَكَ شَيْءٌ، وَأَنْتَ الْآخِرُ فَلَيْسَ بَعْدَكَ شَيْءٌ، وَأَنْتَ الظَّاهِرُ فَلَيْسَ فَوْقَكَ شَيْءٌ، وَأَنْتَ الْبَاطِنُ فَلَيْسَ دُونَكَ شَيْءٌ، اقْضِ عَنَّا الدَّيْنَ وَأَغْنِنَا مِنَ الْفَقْرِ", "tr": {"en": "O Allah, Lord of the seven heavens and Lord of the Mighty Throne, our Lord and Lord of everything, Splitter of the grain and the date-stone, Revealer of the Torah, the Gospel and the Furqan: I seek refuge in You from the evil of everything whose forelock You hold. O Allah, You are the First, so nothing is before You; You are the Last, so nothing is after You; You are the Manifest, so nothing is above You; and You are the Hidden, so nothing is beneath You. Settle our debts for us and enrich us from poverty.", "fr": "Ô Allah, Seigneur des sept cieux et Seigneur du Trône immense, notre Seigneur et Seigneur de toute chose, Celui qui fend le grain et le noyau, qui a fait descendre la Torah, l'Évangile et le Discernement : je me réfugie auprès de Toi contre le mal de toute chose dont Tu tiens le toupet. Ô Allah, Tu es le Premier, rien n'est avant Toi ; Tu es le Dernier, rien n'est après Toi ; Tu es l'Apparent, rien n'est au-dessus de Toi ; Tu es le Caché, rien n'est en deçà de Toi. Acquitte nos dettes et enrichis-nous de la pauvreté.", "ur": "اے اللہ! ساتوں آسمانوں کے رب اور عظیم عرش کے رب، ہمارے رب اور ہر چیز کے رب، دانے اور گٹھلی کو پھاڑنے والے، تورات، انجیل اور فرقان کو نازل کرنے والے! میں ہر اس چیز کے شر سے تیری پناہ چاہتا ہوں جس کی پیشانی تیرے قبضے میں ہے۔ اے اللہ! تو ہی اول ہے، تجھ سے پہلے کچھ نہیں؛ تو ہی آخر ہے، تیرے بعد کچھ نہیں؛ تو ہی ظاہر ہے، تجھ سے اوپر کچھ نہیں؛ اور تو ہی باطن ہے، تجھ سے ورے کچھ نہیں۔ ہمارا قرض ادا کروا دے اور ہمیں فقر سے غنی کر دے۔"}, "count": 1, "source": "مسلم 2713", "grade": "sahih", "tr_status": "needs-review", "tr_en_reviewed": true, "audio": "a/h107.mp3"}, {"id": "s11", "kind": "text", "ar": "اللَّهُمَّ قِنِي عَذَابَكَ يَوْمَ تَبْعَثُ عِبَادَكَ", "tr": {"en": "O Allah, protect me from Your punishment on the Day You resurrect Your servants.", "fr": "Ô Allah, préserve-moi de Ton châtiment le jour où Tu ressusciteras Tes serviteurs.", "ur": "اے اللہ! مجھے اپنے عذاب سے بچا لینا اس دن جب تو اپنے بندوں کو اٹھائے گا۔"}, "count": 1, "source": "أبو داود 5045؛ ابن حبان 5523", "grade": "sahih", "tr_status": "needs-review", "note": {"ar": "يضع يده اليمنى تحت خده الأيمن. وفي رواية حفصة «ثلاث مرات»، ولم تثبت عند الألباني.", "en": "Place the right hand under the right cheek. One narration says three times; al-Albani did not accept that addition."}, "audio": "a/h104.mp3"}, {"id": "s12", "kind": "text", "ar": "سُبْحَانَ اللَّهِ", "tr": {"en": "Glory be to Allah.", "fr": "Gloire à Allah.", "ur": "اللہ پاک ہے۔"}, "count": 33, "source": "البخاري 5362؛ مسلم 2727", "grade": "sahih", "tr_status": "needs-review", "note": {"ar": "تسبيح فاطمة: ثلاثًا وثلاثين.", "en": "Tasbih of Fatima: thirty-three times."}}, {"id": "s13", "kind": "text", "ar": "الْحَمْدُ لِلَّهِ", "tr": {"en": "All praise is for Allah.", "fr": "Louange à Allah.", "ur": "تمام تعریف اللہ کے لیے ہے۔"}, "count": 33, "source": "البخاري 5362؛ مسلم 2727", "grade": "sahih", "tr_status": "needs-review"}, {"id": "s14", "kind": "text", "ar": "اللَّهُ أَكْبَرُ", "tr": {"en": "Allah is the Greatest.", "fr": "Allah est le Plus Grand.", "ur": "اللہ سب سے بڑا ہے۔"}, "count": 34, "source": "البخاري 5362؛ مسلم 2727", "grade": "sahih", "tr_status": "needs-review", "audio": "a/h241.mp3"}, {"id": "s15", "kind": "quran", "ref": "32:1-30", "count": 1, "source": "الترمذي؛ النسائي؛ صححه الألباني (صحيح الجامع 4/255)", "grade": "quran", "note": {"ar": "سورة السجدة: كان لا ينام حتى يقرأ الم تنزيل وتبارك.", "en": "Surat as-Sajdah: the Prophet would not sleep until he recited it and Surat al-Mulk."}}, {"id": "s16", "kind": "quran", "ref": "67:1-30", "count": 1, "source": "الترمذي؛ النسائي؛ صححه الألباني (صحيح الجامع 4/255)", "grade": "quran", "note": {"ar": "سورة الملك قبل النوم.", "en": "Surat al-Mulk before sleep."}}]}, {"id": "upon-waking", "names": {"ar": "أذكار الاستيقاظ", "en": "Upon Waking", "fr": "Au réveil", "ur": "نیند سے بیدار ہونے کی دعائیں"}, "window": "anytime", "items": [{"id": "w01", "kind": "text", "ar": "الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ", "tr": {"en": "All praise is for Allah who gave us life after He caused us to die, and to Him is the resurrection.", "fr": "Louange à Allah qui nous a redonné la vie après nous avoir fait mourir, et c'est vers Lui la résurrection.", "ur": "تمام تعریف اللہ کے لیے ہے جس نے ہمیں موت (نیند) کے بعد زندہ کیا، اور اسی کی طرف اٹھ کر جانا ہے۔"}, "count": 1, "source": "البخاري 6314؛ مسلم 2711", "grade": "sahih", "tr_status": "needs-review"}, {"id": "w02", "kind": "text", "ar": "لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، سُبْحَانَ اللَّهِ، وَالْحَمْدُ لِلَّهِ، وَلَا إِلَهَ إِلَّا اللَّهُ وَاللَّهُ أَكْبَرُ، وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ الْعَلِيِّ الْعَظِيمِ، رَبِّ اغْفِرْ لِي", "tr": {"en": "There is no god but Allah alone, with no partner. His is the dominion and His is the praise, and He has power over everything. Glory be to Allah, praise be to Allah, there is no god but Allah, Allah is the Greatest, and there is no power and no strength except with Allah, the Most High, the Almighty. My Lord, forgive me.", "fr": "Il n'y a de dieu qu'Allah, Seul, sans associé. À Lui la royauté, à Lui la louange, et Il est puissant sur toute chose. Gloire à Allah, louange à Allah, il n'y a de dieu qu'Allah, Allah est le Plus Grand, et il n'y a de puissance ni de force qu'en Allah, le Très-Haut, le Magnifique. Seigneur, pardonne-moi.", "ur": "اللہ کے سوا کوئی معبود نہیں، وہ اکیلا ہے، اس کا کوئی شریک نہیں۔ اسی کی بادشاہی ہے، اسی کی تعریف ہے اور وہ ہر چیز پر قادر ہے۔ اللہ پاک ہے، تمام تعریف اللہ کے لیے ہے، اللہ کے سوا کوئی معبود نہیں، اللہ سب سے بڑا ہے، اور گناہ سے بچنے کی طاقت اور نیکی کی قوت نہیں مگر بلند و عظیم اللہ ہی کی مدد سے۔ اے میرے رب! مجھے بخش دے۔"}, "count": 1, "source": "ابن ماجه 3878؛ أصله في البخاري 1154", "grade": "sahih", "tr_status": "needs-review", "note": {"ar": "لمن استيقظ من الليل: من قالها ثم دعا استُجيب له.", "en": "For one who wakes during the night: if he says it then makes dua, it is answered (Bukhari)."}, "audio": "a/h2.mp3"}, {"id": "w03", "kind": "text", "ar": "الْحَمْدُ لِلَّهِ الَّذِي عَافَانِي فِي جَسَدِي، وَرَدَّ عَلَيَّ رُوحِي، وَأَذِنَ لِي بِذِكْرِهِ", "tr": {"en": "All praise is for Allah who restored well-being to my body, returned my soul to me, and permitted me to remember Him.", "fr": "Louange à Allah qui m'a rendu la santé dans mon corps, qui m'a rendu mon âme et m'a permis de L'invoquer.", "ur": "تمام تعریف اللہ کے لیے ہے جس نے میرے جسم کو عافیت دی، میری روح مجھے لوٹا دی اور مجھے اپنے ذکر کی اجازت دی۔"}, "count": 1, "source": "الترمذي 3401", "grade": "hasan", "tr_status": "needs-review", "audio": "a/h3.mp3"}, {"id": "w04", "kind": "quran", "ref": "3:190-200", "count": 1, "source": "البخاري 4569؛ مسلم 256", "grade": "quran", "note": {"ar": "العشر الآيات الأواخر من سورة آل عمران عند القيام من النوم.", "en": "The last ten verses of Aal Imran, recited on waking (Bukhari, Muslim)."}}]}, {"id": "home", "names": {"ar": "دخول المنزل والخروج منه", "en": "Entering and Leaving Home", "fr": "Entrer dans la maison et en sortir", "ur": "گھر میں داخل ہونے اور نکلنے کی دعائیں"}, "window": "anytime", "items": [{"id": "h01", "kind": "text", "ar": "بِسْمِ اللَّهِ، تَوَكَّلْتُ عَلَى اللَّهِ، وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ", "tr": {"en": "In the name of Allah; I place my trust in Allah; there is no power and no strength except with Allah.", "fr": "Au nom d'Allah ; je place ma confiance en Allah ; il n'y a de puissance ni de force qu'en Allah.", "ur": "اللہ کے نام سے، میں نے اللہ پر بھروسہ کیا، اور گناہ سے بچنے کی طاقت اور نیکی کی قوت نہیں مگر اللہ ہی کی مدد سے۔"}, "count": 1, "source": "أبو داود 5095؛ الترمذي 3426", "grade": "sahih", "tr_status": "needs-review", "note": {"ar": "عند الخروج من المنزل.", "en": "When leaving the home."}}, {"id": "h02", "kind": "text", "ar": "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ أَنْ أَضِلَّ أَوْ أُضَلَّ، أَوْ أَزِلَّ أَوْ أُزَلَّ، أَوْ أَظْلِمَ أَوْ أُظْلَمَ، أَوْ أَجْهَلَ أَوْ يُجْهَلَ عَلَيَّ", "tr": {"en": "O Allah, I seek refuge in You from going astray or being led astray, from slipping or being made to slip, from wronging or being wronged, from acting ignorantly or being treated ignorantly.", "fr": "Ô Allah, je me réfugie auprès de Toi contre le fait de m'égarer ou d'être égaré, de faillir ou de faire faillir, de commettre une injustice ou d'en subir une, d'agir avec ignorance ou qu'on agisse avec ignorance envers moi.", "ur": "اے اللہ! میں تیری پناہ چاہتا ہوں کہ میں گمراہ ہوں یا گمراہ کیا جاؤں، پھسل جاؤں یا پھسلایا جاؤں، ظلم کروں یا مجھ پر ظلم کیا جائے، نادانی کروں یا مجھ سے نادانی کی جائے۔"}, "count": 1, "source": "أبو داود 5094؛ الترمذي 3427؛ النسائي 5501؛ ابن ماجه 3884", "grade": "sahih", "tr_status": "needs-review", "note": {"ar": "عند الخروج من المنزل.", "en": "When leaving the home."}, "audio": "a/h17.mp3"}]}, {"id": "travel", "names": {"ar": "دعاء الركوب والسفر", "en": "Riding, Driving and Travel", "fr": "Monture, conduite et voyage", "ur": "سواری اور سفر کی دعائیں"}, "window": "anytime", "items": [{"id": "r01", "kind": "text", "ar": "بِسْمِ اللَّهِ، الْحَمْدُ لِلَّهِ", "tr": {"en": "In the name of Allah. All praise is for Allah.", "fr": "Au nom d'Allah. Louange à Allah.", "ur": "اللہ کے نام سے۔ تمام تعریف اللہ کے لیے ہے۔"}, "count": 1, "source": "أبو داود 2602؛ الترمذي 3446", "grade": "sahih", "tr_status": "needs-review", "note": {"ar": "عند ركوب الدابة أو السيارة أو أي وسيلة نقل، ثم الآية التالية.", "en": "When mounting an animal, a car or any vehicle; then the verse that follows."}}, {"id": "r02", "kind": "text", "ar": "اللَّهُ أَكْبَرُ، اللَّهُ أَكْبَرُ، اللَّهُ أَكْبَرُ", "tr": {"en": "Allah is the Greatest, Allah is the Greatest, Allah is the Greatest.", "fr": "Allah est le Plus Grand, Allah est le Plus Grand, Allah est le Plus Grand.", "ur": "اللہ سب سے بڑا ہے، اللہ سب سے بڑا ہے، اللہ سب سے بڑا ہے۔"}, "count": 1, "source": "مسلم 1342", "grade": "sahih", "tr_status": "needs-review", "note": {"ar": "تكبير ثلاثًا ثم الآية، كما في حديث مسلم.", "en": "Takbir three times, then the verse, as in the hadith of Muslim."}}, {"id": "r03", "kind": "quran", "ref": "43:13-14", "count": 1, "source": "مسلم 1342؛ أبو داود 2602", "grade": "quran", "note": {"ar": "دعاء الركوب: «سبحان الذي سخر لنا هذا…».", "en": "The dua of riding: 'Glory to Him who has subjected this to us…'."}}, {"id": "r04", "kind": "text", "ar": "الْحَمْدُ لِلَّهِ، الْحَمْدُ لِلَّهِ، الْحَمْدُ لِلَّهِ، اللَّهُ أَكْبَرُ، اللَّهُ أَكْبَرُ، اللَّهُ أَكْبَرُ، سُبْحَانَكَ إِنِّي قَدْ ظَلَمْتُ نَفْسِي فَاغْفِرْ لِي، فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ", "tr": {"en": "All praise is for Allah (three times), Allah is the Greatest (three times). Glory be to You, O Allah; I have wronged myself, so forgive me, for none forgives sins except You.", "fr": "Louange à Allah (trois fois), Allah est le Plus Grand (trois fois). Gloire à Toi, ô Allah ; j'ai été injuste envers moi-même, pardonne-moi, car nul ne pardonne les péchés en dehors de Toi.", "ur": "تمام تعریف اللہ کے لیے ہے (تین بار)، اللہ سب سے بڑا ہے (تین بار)۔ اے اللہ! تو پاک ہے، میں نے اپنے آپ پر ظلم کیا، پس مجھے بخش دے، کیونکہ تیرے سوا کوئی گناہ نہیں بخشتا۔"}, "count": 1, "source": "الترمذي 3446", "grade": "sahih", "tr_status": "needs-review", "note": {"ar": "تُقال بعد الآية في رواية أبي داود والترمذي.", "en": "Said after the verse in the Abu Dawud / Tirmidhi narration."}}, {"id": "r05", "kind": "text", "ar": "اللَّهُمَّ إِنَّا نَسْأَلُكَ فِي سَفَرِنَا هَذَا الْبِرَّ وَالتَّقْوَى، وَمِنَ الْعَمَلِ مَا تَرْضَى", "tr": {"en": "O Allah, we ask You on this journey of ours for righteousness and piety, and for deeds that please You.", "fr": "Ô Allah, nous Te demandons, en ce voyage, la piété et la crainte révérencielle, et des œuvres qui Te agréent.", "ur": "اے اللہ! ہم تجھ سے اپنے اس سفر میں نیکی اور تقویٰ مانگتے ہیں، اور ایسے عمل جن سے تو راضی ہو۔"}, "count": 1, "source": "مسلم 1342", "grade": "sahih", "tr_status": "needs-review", "note": {"ar": "دعاء السفر.", "en": "The travel dua."}}, {"id": "r06", "kind": "text", "ar": "اللَّهُمَّ هَوِّنْ عَلَيْنَا سَفَرَنَا هَذَا، وَاطْوِ عَنَّا بُعْدَهُ، اللَّهُمَّ أَنْتَ الصَّاحِبُ فِي السَّفَرِ، وَالْخَلِيفَةُ فِي الْأَهْلِ، اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ وَعْثَاءِ السَّفَرِ، وَكَآبَةِ الْمَنْظَرِ، وَسُوءِ الْمُنْقَلَبِ فِي الْمَالِ وَالْأَهْلِ", "tr": {"en": "O Allah, make this journey easy for us and fold up its distance for us. O Allah, You are the Companion on the journey and the Guardian of the family. O Allah, I seek refuge in You from the hardship of travel, from a distressing sight, and from an evil return in wealth and family.", "fr": "Ô Allah, facilite-nous ce voyage et raccourcis-nous sa distance. Ô Allah, Tu es le Compagnon du voyage et le Garant de la famille. Ô Allah, je me réfugie auprès de Toi contre les peines du voyage, le spectacle affligeant et le mauvais retour pour les biens et la famille.", "ur": "اے اللہ! ہمارے لیے یہ سفر آسان کر دے اور اس کی دوری ہمارے لیے لپیٹ دے۔ اے اللہ! تو ہی سفر میں ساتھی اور گھر والوں میں نگہبان ہے۔ اے اللہ! میں سفر کی مشقت، منظر کی بدحالی اور مال و اہل میں بری واپسی سے تیری پناہ چاہتا ہوں۔"}, "count": 1, "source": "مسلم 1342", "grade": "sahih", "tr_status": "needs-review"}, {"id": "r07", "kind": "text", "ar": "آيِبُونَ، تَائِبُونَ، عَابِدُونَ، لِرَبِّنَا حَامِدُونَ", "tr": {"en": "We return, repenting, worshipping, and praising our Lord.", "fr": "Nous revenons, repentants, adorateurs, louant notre Seigneur.", "ur": "ہم لوٹنے والے ہیں، توبہ کرنے والے، عبادت کرنے والے، اپنے رب کی حمد کرنے والے۔"}, "count": 1, "source": "مسلم 1342", "grade": "sahih", "tr_status": "needs-review", "note": {"ar": "عند الرجوع من السفر يقول الدعاء السابق ويزيد هذا.", "en": "On returning, say the previous dua and add this."}}, {"id": "r08", "kind": "text", "ar": "أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ", "tr": {"en": "I seek refuge in the perfect words of Allah from the evil of what He has created.", "fr": "Je me réfugie dans les paroles parfaites d'Allah contre le mal de ce qu'Il a créé.", "ur": "میں اللہ کے کامل کلمات کی پناہ چاہتا ہوں ہر اس چیز کے شر سے جو اس نے پیدا کی۔"}, "count": 1, "source": "مسلم 2708", "grade": "sahih", "tr_status": "needs-review", "note": {"ar": "عند النزول في مكان أثناء السفر: لم يضره شيء حتى يرتحل.", "en": "When stopping at a place on a journey: nothing harms him until he departs."}}, {"id": "r09", "kind": "text", "ar": "أَسْتَوْدِعُ اللَّهَ دِينَكَ وَأَمَانَتَكَ، وَخَوَاتِيمَ عَمَلِكَ", "tr": {"en": "I entrust to Allah your religion, your trust and the final outcomes of your deeds.", "fr": "Je confie à Allah ta religion, ton dépôt et la finalité de tes œuvres.", "ur": "میں تیرے دین، تیری امانت اور تیرے اعمال کے انجام کو اللہ کے سپرد کرتا ہوں۔"}, "count": 1, "source": "أحمد 4524؛ الترمذي 3443", "grade": "sahih", "tr_status": "needs-review", "note": {"ar": "يقولها المقيم للمسافر عند التوديع.", "en": "Said by the one staying to the traveller when bidding farewell."}}]}, {"id": "distress", "names": {"ar": "دعاء الهم والكرب", "en": "Distress and Anxiety", "fr": "Détresse et angoisse", "ur": "غم اور پریشانی کی دعائیں"}, "window": "anytime", "items": [{"id": "d01", "kind": "text", "ar": "لَا إِلَهَ إِلَّا اللَّهُ الْعَظِيمُ الْحَلِيمُ، لَا إِلَهَ إِلَّا اللَّهُ رَبُّ الْعَرْشِ الْعَظِيمِ، لَا إِلَهَ إِلَّا اللَّهُ رَبُّ السَّمَاوَاتِ وَرَبُّ الْأَرْضِ وَرَبُّ الْعَرْشِ الْكَرِيمِ", "tr": {"en": "There is no god but Allah, the Almighty, the Forbearing. There is no god but Allah, Lord of the Mighty Throne. There is no god but Allah, Lord of the heavens, Lord of the earth and Lord of the Noble Throne.", "fr": "Il n'y a de dieu qu'Allah, le Magnifique, le Longanime. Il n'y a de dieu qu'Allah, Seigneur du Trône immense. Il n'y a de dieu qu'Allah, Seigneur des cieux, Seigneur de la terre et Seigneur du Trône noble.", "ur": "اللہ کے سوا کوئی معبود نہیں، جو عظمت والا، بردبار ہے۔ اللہ کے سوا کوئی معبود نہیں، جو عرشِ عظیم کا رب ہے۔ اللہ کے سوا کوئی معبود نہیں، جو آسمانوں کا رب، زمین کا رب اور عرشِ کریم کا رب ہے۔"}, "count": 1, "source": "البخاري 6345؛ مسلم 2730", "grade": "sahih", "tr_status": "needs-review"}, {"id": "d02", "kind": "text", "ar": "اللَّهُمَّ إِنِّي عَبْدُكَ، ابْنُ عَبْدِكَ، ابْنُ أَمَتِكَ، نَاصِيَتِي بِيَدِكَ، مَاضٍ فِيَّ حُكْمُكَ، عَدْلٌ فِيَّ قَضَاؤُكَ، أَسْأَلُكَ بِكُلِّ اسْمٍ هُوَ لَكَ، سَمَّيْتَ بِهِ نَفْسَكَ، أَوْ أَنْزَلْتَهُ فِي كِتَابِكَ، أَوْ عَلَّمْتَهُ أَحَدًا مِنْ خَلْقِكَ، أَوِ اسْتَأْثَرْتَ بِهِ فِي عِلْمِ الْغَيْبِ عِنْدَكَ، أَنْ تَجْعَلَ الْقُرْآنَ رَبِيعَ قَلْبِي، وَنُورَ صَدْرِي، وَجَلَاءَ حُزْنِي، وَذَهَابَ هَمِّي", "tr": {"en": "O Allah, I am Your servant, son of Your servant, son of Your maidservant; my forelock is in Your hand. Your judgment over me is ever-executed and Your decree for me is just. I ask You by every name that is Yours, by which You named Yourself, or revealed in Your Book, or taught to any of Your creation, or kept to Yourself in the knowledge of the unseen: make the Qur'an the spring of my heart, the light of my chest, the departure of my sorrow and the removal of my worry.", "fr": "Ô Allah, je suis Ton serviteur, fils de Ton serviteur, fils de Ta servante ; mon toupet est dans Ta main. Ton jugement s'exécute sur moi et Ton décret à mon égard est juste. Je Te demande par chaque nom qui est à Toi, par lequel Tu T'es nommé, ou que Tu as révélé dans Ton Livre, ou enseigné à l'une de Tes créatures, ou gardé pour Toi dans la science de l'invisible : fais du Coran le printemps de mon cœur, la lumière de ma poitrine, la dissipation de ma tristesse et la fin de mon souci.", "ur": "اے اللہ! میں تیرا بندہ ہوں، تیرے بندے کا بیٹا، تیری بندی کا بیٹا؛ میری پیشانی تیرے ہاتھ میں ہے، مجھ میں تیرا حکم جاری ہے، مجھ پر تیرا فیصلہ عین انصاف ہے۔ میں تجھ سے تیرے ہر اس نام کے وسیلے سے مانگتا ہوں جو تیرا ہے، جس سے تو نے اپنے آپ کو موسوم کیا، یا اپنی کتاب میں نازل کیا، یا اپنی مخلوق میں سے کسی کو سکھایا، یا اپنے علمِ غیب میں اپنے پاس رکھا، کہ تو قرآن کو میرے دل کی بہار، میرے سینے کا نور، میرے غم کو دور کرنے والا اور میری پریشانی کو لے جانے والا بنا دے۔"}, "count": 1, "source": "أحمد 3712 (1/391)؛ صححه الألباني (الصحيحة 1/337)", "grade": "sahih", "tr_status": "needs-review", "audio": "a/h120.mp3"}, {"id": "d03", "kind": "text", "ar": "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِن
